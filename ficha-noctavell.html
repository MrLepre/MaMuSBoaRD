<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Noctavell — Ficha Completa</title>
<style>
:root{--ouro:#c9a45c;--fundo:#09090c;--painel:#15141a;--borda:#3a3030;--texto:#eee8df;--muted:#a9a0a0;--vermelho:#9f3d46;--violeta:#5d4a73;--verde:#536f58}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17121b 0,#09090c 60%);color:var(--texto);font-family:Georgia,'Times New Roman',serif}.wrap{max-width:1200px;margin:auto;padding:14px}.topo{border:1px solid var(--borda);background:linear-gradient(145deg,#17151c,#0e0d11);padding:18px;border-radius:12px}.marca{color:var(--ouro);letter-spacing:3px;font-size:.78rem}.topo h1{margin:5px 0;font-size:2rem}.topo p{margin:4px 0;color:var(--muted)}.acoes,.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.btn{background:#211d25;color:var(--texto);border:1px solid #594a42;border-radius:7px;padding:10px 13px;cursor:pointer;font:inherit}.btn:hover{border-color:var(--ouro)}.btn.principal{background:#513d28;border-color:var(--ouro)}.btn.perigo{border-color:#7d3b43}.btn.ok{border-color:#536f58}.tabs{display:flex;gap:6px;overflow:auto;padding:11px 0;position:sticky;top:0;background:#09090cf2;z-index:4}.tab{white-space:nowrap}.tab.ativo{border-color:var(--ouro);color:#f5d58d}.painel{display:none}.painel.ativo{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.card{background:var(--painel);border:1px solid var(--borda);border-radius:10px;padding:15px;margin-bottom:12px}.card h2,.card h3{margin-top:0;color:#e7c982}.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.campo span,.small{font-size:.8rem;color:var(--muted)}input,select,textarea{width:100%;background:#0d0c10;color:var(--texto);border:1px solid #493e42;border-radius:6px;padding:9px;font:inherit}textarea{min-height:78px;resize:vertical}.atributo{border:1px solid #383138;border-radius:8px;padding:10px}.atributo strong{color:#e3c67f}.atributo input{margin-top:7px}.total{text-align:center;border:1px solid #594a42;padding:9px;border-radius:8px;color:#e5c77f}.pill{display:inline-block;border:1px solid #5b4b50;border-radius:999px;padding:4px 8px;font-size:.78rem;color:#d5c5c5}.segredo{filter:blur(4px);transition:.2s}.segredo:focus{filter:none}.barra{height:12px;background:#08080a;border:1px solid #40383a;border-radius:20px;overflow:hidden;margin:8px 0}.barra i{display:block;height:100%;background:var(--vermelho);width:0}.recurso{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid #393238;border-radius:8px;padding:10px}.recurso strong{font-size:1.35rem;color:#e5c77f}.lista{display:grid;gap:9px}.item{padding:11px;border:1px solid #393238;border-radius:8px;background:#100f14}.item h4{margin:0 0 5px;color:#d9bd78}.nota{color:var(--muted);font-size:.88rem}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.contrato-card{border-color:#594a42}.contrato-card.selado{border-color:#8a6d36}.contrato-card.quebrado{border-color:#7d3b43;opacity:.88}.contrato-card.encerrado{border-color:#536f58;opacity:.8}.contrato-status{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid #554b4d;font-size:.72rem}.contrato-meta{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0}.contrato-acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.editor{border:1px solid #4b3d3f;border-radius:10px;padding:14px;background:#0d0c10;margin-top:12px}.editor h3{margin:0 0 12px;color:#e7c982}.clausulas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.final{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.entidade{border:1px solid #44393c;border-radius:8px;background:#111015;padding:11px}.entidade strong{color:#e3c67f}.face{border:1px solid #44393c;border-radius:8px;padding:12px;text-align:center;background:#111015}.face b{display:block;font-size:1.7rem;color:#e5c77f}.face span{font-size:.78rem;color:var(--muted)}.resultado{font-size:1.2rem;border:1px solid #594a42;border-radius:9px;padding:13px;background:#100f14}.juramento{border-left:3px solid var(--ouro);padding-left:12px}.rodape{margin-top:12px;color:#776f72;font-size:.76rem;text-align:center}@media(max-width:820px){.grid,.grid3,.clausulas,.final{grid-template-columns:1fr}.grid5{grid-template-columns:repeat(2,minmax(0,1fr))}.topo h1{font-size:1.55rem}.wrap{padding:9px}}@media(max-width:430px){.grid5{grid-template-columns:1fr}.btn{width:100%}.acoes .btn,.contrato-acoes .btn{width:auto}}
</style>
</head>
<body>
<div class="wrap">
<header class="topo"><div class="marca">✡ NOCTAVELL</div><h1>Onde até a alma tem preço</h1><p>Ficha completa — Véu Inferior, Arcântria, pactos, contratos e consequências.</p><div class="acoes"><button class="btn principal" type="button" onclick="salvar()">💾 Enviar para a Mesa</button><button class="btn" type="button" onclick="salvarLocal()">📌 Salvar local</button><button class="btn" type="button" onclick="rolarVéu()">🎲 Rolar Dado do Véu</button></div></header>
<nav class="tabs" id="tabs"></nav><main id="conteudo"></main><div class="rodape">Noctavell · sistema específico · regras implementadas a partir do guia fornecido</div>
</div>
<script>
const TABS=[['identidade','✡ Identidade'],['atributos','🧠 Atributos'],['nome','🔐 Nome Verdadeiro'],['pactos','📜 Pactos'],['entidade','👁️ Entidades'],['artefatos','✠ Artefatos'],['magia','✦ Fluxo Vivo'],['combate','🩸 Combate'],['sanidade','🧠 Sanidade'],['imersao','🎭 Imersão'],['arcântria','🏛️ Arcântria'],['historia','📖 História']];
const ATTR=[['presenca','Presença','Influência social e arcana.'],['vontade','Vontade','Resistência mental e espiritual.'],['instinto','Instinto','Reação, percepção e reflexo.'],['ocultismo','Ocultismo','Conhecimento dos pactos, rituais e entidades.'],['corrupcao','Corrupção','Influência do Véu; quanto maior, maiores os efeitos negativos.']];
const FACES={1:['⚖️','Equilíbrio','Sucesso parcial com custo.'],2:['🔥','Ruptura','Sucesso forte, mas com tensão ou risco oculto.'],3:['🌑','Silêncio','Falha; nada acontece ou o efeito se anula.'],4:['🔯','Eco','O Véu responde com efeito secundário inesperado.'],5:['🔑','Verdade','Sucesso total com elegância.'],6:['👁️','Olho do Véu','Sucesso crítico + revelação ou conhecimento oculto.']};
const TRAUMAS=['Vozes do Véu','Fobia Arcana','Obsessão por Controle','Culpa Fantasma','Apagamento','Riso Involuntário','Olhar Duplo'];
const TIPOS_FERIDA=['Leve','Grave','Mortal'];
const BATIDAS=['Preparação','Confronto','Clímax','Desfecho'];
let entidadesCatalogo=[], contratoEditando=-1, magiaEditando=-1;
let dados={nome:'',nivel:1,jogador:'',idade:'',conceito:'',nome_publico:'',nome_verdadeiro:'',protecao_nome:'',nome_estado:'protegido',atributos:{presenca:3,vontade:3,instinto:3,ocultismo:3,corrupcao:3},pacto_interno:{ativo:false,nivel:1,declaracao:'',risco:'',recompensa:'',sinal:''},contratos:[],entidade:{nome:'',nivel:'',dominio:'',corrupcao:'',manifestacao:'',promessa:'',preco:'',termo:'',estilo:''},artefatos:[],magias_basicas:3,magias_basicas_max:3,magias:[],sanidade:6,sanidade_max:6,traumas:[],folego:5,folego_max:5,feridas:[],estado_critico:'',marcas_veu:'',pontos_imersao:0,moedas_arcantria:0,diario:{medo:'',memoria:'',eco:''},interesse:[],batida_atual:'Preparação',historia:'',segredos:'',notas:'',arcântria:{local_favorito:'',reputacao:'',favores:'',dividas:'',observacoes:''}};
let modo='criacao';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function campo(k,label,type='text',extra=''){return `<label class="campo"><span>${label}</span><input data-k="${k}" type="${type}" value="${esc(dados[k]??'')}" ${extra}></label>`}
function tab(id,title,body){return `<section id="p-${id}" class="painel"><div class="card"><h2>${title}</h2>${body}</div></section>`}
function render(){
 const ativos=TABS.map((t,i)=>`<button class="btn tab ${i===0?'ativo':''}" type="button" onclick="abrir('${t[0]}',this)">${t[1]}</button>`).join('');document.getElementById('tabs').innerHTML=ativos;
 const attrs=ATTR.map(([k,n,d])=>`<div class="atributo"><strong>${n}</strong><div class="nota">${d}</div><input data-attr="${k}" type="number" min="1" max="5" value="${Math.max(1,Math.min(5,Number(dados.atributos[k]||1)))}"></div>`).join('');
 const p=dados.pacto_interno||{};
 document.getElementById('conteudo').innerHTML=[
 tab('identidade','✡ Identidade',`<div class="grid">${campo('nome','Nome público')}${campo('nivel','Nível','number','min="1"')}${campo('jogador','Jogador')}${campo('idade','Idade')}${campo('conceito','Conceito')}${campo('notas','Notas rápidas')}</div><p class="nota">Noctavell usa identidade pública e metafísica separadas. O Nome Verdadeiro é tratado em aba própria.</p>`),
 tab('atributos','🧠 Atributos',`<p class="nota">Criação: 15 pontos entre Presença, Vontade, Instinto, Ocultismo e Corrupção. Cada atributo inicia entre 1 e 5.</p><div class="grid5">${attrs}</div><div class="total">Total atual: ${Object.values(dados.atributos).reduce((a,b)=>a+Number(b||0),0)} / 15</div>`),
 tab('nome','🔐 Nome Verdadeiro',`<div class="grid">${campo('nome_publico','Nome público')}${campo('nome_verdadeiro','Nome verdadeiro','text','class="segredo" autocomplete="off"')}${campo('protecao_nome','Forma de proteção')}${campo('nome_estado','Estado do nome')}</div><div class="card juramento"><h3>Quando o Nome é conhecido</h3><ul><li>Contrato profundo: mais poderoso e permanente.</li><li>Rastreamento/compulsão: funcionam sem resistência.</li><li>Maldições e selamentos: dobram de intensidade.</li><li>Artefatos jurados: podem ser ligados diretamente à alma.</li><li>Convocação arcana: a alma pode ser chamada.</li><li>Traição: permite selar promessas contra o portador sem aviso.</li></ul></div><div class="toolbar"><button class="btn" type="button" onclick="trocarNome()">🔄 Trocar Nome Verdadeiro</button></div><p class="nota">Troca: mínimo 3 Moedas de Arcântria, ritual profundo na Corte de Cera; invalida promessas anteriores e reinicia a Corrupção ao nível inicial.</p>`),
 tab('pactos','📜 Pactos & Contratos',`<div class="juramento"><h3>✧ Pacto Consigo Mesmo — Juramento da Alma</h3><label class="check"><input id="pacto-ativo" type="checkbox" ${p.ativo?'checked':''}> Pacto Interno ativo</label><div class="grid">${[['declaracao','Declaração'],['risco','Risco ao quebrar'],['recompensa','Recompensa'],['sinal','Sinal do Véu']].map(([k,l])=>`<label class="campo"><span>${l}</span><textarea id="pacto-${k}">${esc(p[k]||'')}</textarea></label>`).join('')}<label class="campo"><span>Nível do Juramento (1–4)</span><input id="pacto-nivel" type="number" min="1" max="4" value="${p.nivel||1}"></label></div></div><p class="nota">1 Pacto Interno ativo. Quebra ativa imediatamente o risco, salvo renegociação de alto custo narrativo e mágico. Nível 1–4 aumenta poder e gravidade do risco.</p><h3>Contratos externos</h3><p class="nota">Máximo de 3 contratos simultâneos. Um contrato deve possuir entidade, cláusulas, preço, prazo e quebra antes de ser selado.</p><div id="contratos" class="lista"></div><button class="btn principal" type="button" onclick="novoContrato()">📜 Novo Contrato</button><div id="editor-contrato"></div>`),
 tab('entidade','👁️ Entidades do Véu',`<div class="grid"><label class="campo"><span>Catálogo oficial</span><select id="entidade-catalogo"><option value="">Selecione...</option></select></label><div id="entidade-preview" class="entidade">Nenhuma entidade selecionada.</div></div><div class="grid">${[['nome','Entidade ligada'],['nivel','Nível'],['dominio','Domínio'],['corrupcao','Corrupção'],['manifestacao','Manifestação'],['promessa','Promessa / benefício'],['preco','Preço / custo'],['termo','Termo oculto'],['estilo','Estilo de contrato']].map(([k,l])=>`<label class="campo"><span>${l}</span><textarea data-ent="${k}">${esc(dados.entidade[k]||'')}</textarea></label>`).join('')}</div><p class="nota">O catálogo contém as 100 entidades fornecidas no documento de pactos, organizadas pelos graus I–V.</p>`),
 tab('artefatos','✠ Artefatos Jurados',`<div id="artefatos" class="lista"></div><button class="btn" type="button" onclick="novoArtefato()">＋ Novo Artefato Jurado</button><p class="nota">Todo artefato exige Promessa Ativa, Efeito enquanto cumprida e Consequência ao quebrar. Ativa automaticamente quando a promessa é cumprida.</p>`),
 tab('magia','✦ Fluxo Vivo',`<div class="grid"><div class="recurso"><span>Magias básicas disponíveis nesta cena</span><strong id="magias-restantes">${dados.magias_basicas}</strong></div><div class="recurso"><span>Máximo normal</span><strong>3</strong></div></div><div class="toolbar"><button class="btn principal" type="button" onclick="usarMagiaBasica()">✦ Usar Magia Básica</button><button class="btn" type="button" onclick="recuperarMagias()">↻ Recuperar por descanso narrativo</button><button class="btn" type="button" onclick="novoSacrificio()">🜂 Declarar Sacrifício</button></div><p class="nota">Fluxo Vivo não requer pacto. É sutil, simbólico, não causa dano direto significativo e não é mais eficaz que arma comum. A magia deve respeitar pelo menos 2 limites naturais: alcance curto, duração curta, um alvo/coisa, gesto/palavra, ou ser interrompível.</p><div id="magias-lista" class="lista"></div><div class="card"><h3>🜂 Sacrifícios</h3><div id="sacrificios"></div></div>`),
 tab('combate','🩸 Combate — Feridas & Fôlego',`<div class="grid3"><div class="recurso"><span>Fôlego atual</span><strong>${dados.folego}/${dados.folego_max}</strong></div><div class="recurso"><span>Feridas</span><strong>${dados.feridas.length}</strong></div><div class="recurso"><span>Estado crítico</span><strong>${esc(dados.estado_critico||'—')}</strong></div></div><div class="toolbar"><button class="btn" type="button" onclick="alterarFolego(-1)">− Fôlego</button><button class="btn" type="button" onclick="alterarFolego(1)">＋ Fôlego</button><button class="btn perigo" type="button" onclick="novaFerida()">🩸 Registrar Ferida</button><button class="btn" type="button" onclick="testeMorte()">🧠 Teste de Vontade</button></div><div class="barra"><i style="width:${Math.max(0,Math.min(100,(dados.folego/Math.max(1,dados.folego_max))*100))}%"></i></div><p class="nota">Fôlego inicial 5, máximo 8. Quando chega a 0, o próximo acerto real gera Ferida. Feridas: Leve, Grave, Mortal. Três Feridas ou uma Mortal matam um humano sem ajuda imediata. Combate é narrativo e não usa iniciativa fixa.</p><div id="feridas" class="lista"></div>`),
 tab('sanidade','🧠 Sanidade & Traumas',`<div class="grid3"><div class="recurso"><span>Sanidade</span><strong>${dados.sanidade}/${dados.sanidade_max}</strong></div><div class="recurso"><span>Traumas</span><strong>${dados.traumas.length}</strong></div><div class="recurso"><span>Corrupção</span><strong>${dados.atributos.corrupcao}</strong></div></div><div class="barra"><i style="width:${Math.max(0,Math.min(100,(dados.sanidade/Math.max(1,dados.sanidade_max))*100))}%"></i></div><div class="toolbar"><button class="btn" type="button" onclick="alterarSanidade(-1)">− Sanidade</button><button class="btn" type="button" onclick="alterarSanidade(1)">＋ Sanidade</button><button class="btn perigo" type="button" onclick="testeSanidade()">🎲 Teste de Sanidade</button><button class="btn" type="button" onclick="novoTrauma()">＋ Trauma</button></div><div id="traumas" class="lista"></div><p class="nota">Sanidade inicial 6. Perdas incluem entidades verdadeiras, Ferida Mortal, verdades proibidas, quebra de contrato mental, magia além da compreensão e sonhos de Arcântria sem preparo. Ao chegar a 0: Colapso Mental; depois ganha 1 Trauma permanente e volta a 3.</p>`),
 tab('imersao','🎭 Imersão & Roleplay',`<div class="grid3"><div class="recurso"><span>Pontos de Imersão</span><strong>${dados.pontos_imersao}/3</strong></div><div class="recurso"><span>Batida atual</span><strong>${esc(dados.batida_atual)}</strong></div><div class="recurso"><span>Interesse</span><strong>${dados.interesse.length}</strong></div></div><div class="toolbar">${BATIDAS.map(b=>`<button class="btn" type="button" onclick="definirBatida('${b}')">${b}</button>`).join('')}<button class="btn principal" type="button" onclick="ganharImersao()">＋ Imersão</button><button class="btn" type="button" onclick="gastarImersao()">− Gastar Imersão</button><button class="btn" type="button" onclick="novoInteresse()">＋ Marcador de Interesse</button></div><div class="card"><h3>📖 Diário do Véu</h3><div class="grid">${[['medo','Um medo despertado'],['memoria','Um fragmento de memória que emergiu'],['eco','Um eco do Véu que persiste']].map(([k,l])=>`<label class="campo"><span>${l}</span><textarea data-diario="${k}">${esc(dados.diario[k]||'')}</textarea></label>`).join('')}</div><p class="nota">Incorporar uma nota na próxima sessão gera 1 rerrolagem gratuita ou 1 Insight Arcano.</p></div><div id="interesses" class="lista"></div>`),
 tab('arcântria','🏛️ Arcântria — Hotel dos Pactos',`<div class="grid">${campo('arcântria.local_favorito','Local favorito')}${campo('arcântria.reputacao','Reputação')}${campo('arcântria.favores','Favores')}${campo('arcântria.dividas','Dívidas')}</div><label class="campo"><span>Observações</span><textarea id="arc-observacoes">${esc(dados.arcântria.observacoes||'')}</textarea></label><div class="grid3"><div class="item"><h4>🏨 Saguão do Véu</h4><div class="nota">Negociações e contratos.</div></div><div class="item"><h4>📚 Arquivo das Quebras</h4><div class="nota">Biblioteca das promessas rompidas.</div></div><div class="item"><h4>🍸 Contrafluxo</h4><div class="nota">Bar que serve memórias líquidas.</div></div><div class="item"><h4>⚖️ Corte de Cera</h4><div class="nota">Tribunal de disputas arcanas.</div></div><div class="item"><h4>🚪 Portaria das Entidades</h4><div class="nota">Audiências com forças ocultas.</div></div></div><p class="nota">Regras: promessas ditas em Arcântria têm validade; nenhuma agressão direta pode ocorrer; o Véu escuta sempre.</p>`),
 tab('historia','📖 História, Segredos & Marcas',`<label class="campo"><span>História</span><textarea id="historia">${esc(dados.historia)}</textarea></label><label class="campo"><span>Segredos</span><textarea id="segredos" class="segredo">${esc(dados.segredos)}</textarea></label><label class="campo"><span>Marcas do Véu</span><textarea id="marcas">${esc(dados.marcas_veu)}</textarea></label><p class="nota">Trabalhos de fachada podem fornecer dinheiro humano, reputação e acesso, mas a evolução mágica é medida por Moedas de Arcântria.</p>`)
 ].join('');renderListas();bind();carregarEntidadesCatalogo();
}
function abrir(id,btn){document.querySelectorAll('.painel').forEach(x=>x.classList.remove('ativo'));document.getElementById('p-'+id)?.classList.add('ativo');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('ativo'));btn?.classList.add('ativo');if(id==='pactos')renderContratos();}
function renderListas(){renderContratos();renderArtefatos();renderFeridas();renderTraumas();renderMagias();renderInteresses();}
function statusLabel(s){return s==='selado'?'🔒 Selado':s==='quebrado'?'💥 Quebrado':s==='encerrado'?'✓ Encerrado':'✍️ Rascunho'}
function normalizarContrato(x){return {nome:x.nome||'Contrato sem nome',grau:x.grau||'I',entidade:x.entidade||'',entidade_nivel:x.entidade_nivel||'',dominio:x.dominio||'',corrupcao:x.corrupcao||'',portador:x.portador||dados.nome||'',testemunhas:x.testemunhas||'',local_data:x.local_data||'',estilo_entidade:x.estilo_entidade||'',beneficio:x.beneficio||x.clausula||'',gatilho:x.gatilho||'',limites:x.limites||'',alvos_alcance:x.alvos_alcance||'',custo:x.custo||x.preco||'',risco:x.risco||'',proibicoes:x.proibicoes||'',prova_validacao:x.prova_validacao||'',quebra_penalidade:x.quebra_penalidade||x.quebra||'',quebra_executada_por:x.quebra_executada_por||'',excecoes:x.excecoes||'',preco:x.preco||'',prazo:x.prazo||'',quebra:x.quebra||'',status:x.status||'rascunho',criado_em:x.criado_em||new Date().toISOString(),selado_em:x.selado_em||'',selado_por:x.selado_por||'',termo_oculto:x.termo_oculto||''}}
function renderContratos(){const c=document.getElementById('contratos');if(!c)return;c.innerHTML=(dados.contratos||[]).map((raw,i)=>{const x=normalizarContrato(raw);dados.contratos[i]=x;const cls=x.status==='selado'?'selado':x.status==='quebrado'?'quebrado':x.status==='encerrado'?'encerrado':'';return `<div class="item contrato-card ${cls}"><h4>${esc(x.nome)}</h4><div class="contrato-meta"><span class="pill">Grau ${esc(x.grau)}</span><span class="contrato-status">${statusLabel(x.status)}</span>${x.entidade?`<span class="pill">👁️ ${esc(x.entidade)}</span>`:''}${x.corrupcao?`<span class="pill">Corrupção: ${esc(x.corrupcao)}</span>`:''}</div><div>${esc(x.beneficio||'Benefício não definido.')}</div><div class="nota">Preço: ${esc(x.preco||x.custo||'—')} · Prazo: ${esc(x.prazo||'—')} · Quebra: ${esc(x.quebra_penalidade||x.quebra||'—')}</div><div class="contrato-acoes"><button class="btn" type="button" onclick="editarContrato(${i})">✏️ Abrir contrato</button>${x.status!=='selado'&&x.status!=='quebrado'&&x.status!=='encerrado'?`<button class="btn ok" type="button" onclick="selarContrato(${i})">🔒 Selar</button>`:''}${x.status==='selado'?`<button class="btn perigo" type="button" onclick="quebrarContrato(${i})">💥 Registrar quebra</button><button class="btn" type="button" onclick="encerrarContrato(${i})">✓ Encerrar</button>`:''}<button class="btn perigo" type="button" onclick="remover('contratos',${i})">🗑️</button></div></div>`}).join('')||'<div class="nota">Nenhum contrato registrado.</div>';if(contratoEditando>=0)renderEditorContrato(contratoEditando)}
function novoContrato(){if((dados.contratos||[]).filter(x=>x.status==='selado').length>=3){alert('Noctavell permite no máximo 3 contratos simultâneos.');return}dados.contratos.push(normalizarContrato({grau:'I',portador:dados.nome||''}));contratoEditando=dados.contratos.length-1;renderContratos()}
function editarContrato(i){contratoEditando=i;renderContratos()}
function renderEditorContrato(i){const x=normalizarContrato(dados.contratos[i]);const box=document.getElementById('editor-contrato');if(!box)return;const input=(k,l,type='text',val=x[k]||'')=>`<label class="campo"><span>${l}</span>${type==='textarea'?`<textarea data-ct="${k}">${esc(val)}</textarea>`:`<input data-ct="${k}" value="${esc(val)}">`}</label>`;box.innerHTML=`<div class="editor"><h3>📜 Contrato — ${esc(x.nome)}</h3><div class="grid3">${input('nome','Nome')}${input('grau','Grau')}${input('entidade','Entidade')}${input('entidade_nivel','Nível da entidade')}${input('dominio','Domínio')}${input('corrupcao','Corrupção')}</div><h4>PARTES</h4><div class="grid">${input('portador','Portador')}${input('testemunhas','Testemunhas')}${input('local_data','Local / Data')}${input('estilo_entidade','Estilo da entidade')}</div><h4>CLÁUSULAS</h4><div class="clausulas">${input('beneficio','1) Benefício prometido','textarea')}${input('gatilho','2) Gatilho','textarea')}${input('limites','3) Limites','textarea')}${input('alvos_alcance','4) Alvos / alcance','textarea')}${input('custo','5) Custo','textarea')}${input('risco','6) Risco','textarea')}${input('proibicoes','7) Proibições','textarea')}${input('prova_validacao','8) Prova / validação','textarea')}${input('quebra_penalidade','9) Quebra — penalidade','textarea')}${input('quebra_executada_por','9) Quem executa a quebra','textarea')}${input('excecoes','10) Exceções / escape clause','textarea')}${input('termo_oculto','Termo oculto','textarea')}</div><h4>PREÇO / PRAZO / QUEBRA</h4><div class="final">${input('preco','Preço')}${input('prazo','Prazo')}${input('quebra','Resumo da quebra')}</div><div class="toolbar"><button class="btn principal" type="button" onclick="salvarContratoEditor(${i})">💾 Salvar contrato</button><button class="btn" type="button" onclick="carregarEntidadeNoContrato(${i})">👁️ Preencher pela entidade</button><button class="btn" type="button" onclick="contratoEditando=-1;document.getElementById('editor-contrato').innerHTML=''">Fechar</button></div><p class="nota">Um contrato selado deve ser literal, validável e ter risco compatível com o benefício. O modelo aceita os campos oficiais fornecidos para Noctavell.</p></div>`}
function salvarContratoEditor(i){const box=document.getElementById('editor-contrato');box.querySelectorAll('[data-ct]').forEach(e=>dados.contratos[i][e.dataset.ct]=e.value.trim());dados.contratos[i]=normalizarContrato(dados.contratos[i]);renderContratos()}
function carregarEntidadeNoContrato(i){const e=entidadesCatalogo.find(x=>String(x.nome).toLowerCase()===String(dados.contratos[i].entidade||'').toLowerCase())||entidadesCatalogo[0];if(!e)return;Object.assign(dados.contratos[i],{entidade:e.nome,entidade_nivel:e.nivel,dominio:e.dominio,corrupcao:e.corrupcao,estilo_entidade:e.estilo,beneficio:dados.contratos[i].beneficio||e.promessa,custo:dados.contratos[i].custo||e.preco,termo_oculto:dados.contratos[i].termo_oculto||e.promessa});renderContratos()}
function validarContrato(x){const req=['nome','grau','entidade','beneficio','gatilho','limites','alvos_alcance','custo','risco','proibicoes','prova_validacao','quebra_penalidade','preco','prazo'];return req.filter(k=>!String(x[k]||'').trim())}
function selarContrato(i){const x=normalizarContrato(dados.contratos[i]);const falt=validarContrato(x);if(falt.length){alert('Preencha todas as cláusulas essenciais antes de selar o contrato.');contratoEditando=i;renderContratos();return}if(dados.contratos.filter(c=>c.status==='selado').length>=3){alert('Limite de 3 contratos simultâneos atingido.');return}x.status='selado';x.selado_em=new Date().toISOString();x.selado_por=dados.jogador||'Mestre';dados.contratos[i]=x;renderContratos()}
function quebrarContrato(i){const x=dados.contratos[i];if(!confirm('Registrar a quebra deste contrato? A penalidade definida será aplicada narrativamente pelo Mestre.'))return;x.status='quebrado';x.quebrado_em=new Date().toISOString();dados.contratos[i]=x;dados.marcas_veu=(dados.marcas_veu?dados.marcas_veu+'\n':'')+'Quebra de contrato: '+x.nome;renderContratos()}
function encerrarContrato(i){dados.contratos[i].status='encerrado';renderContratos()}
function renderArtefatos(){const c=document.getElementById('artefatos');if(!c)return;c.innerHTML=dados.artefatos.map((x,i)=>`<div class="item"><h4>${esc(x.nome||'Artefato Jurado')}</h4><div class="nota">${esc(x.tipo||'Objeto')} · ${x.ativo?'🟢 Ativo':'⚪ Inativo'}</div><div><b>Promessa:</b> ${esc(x.promessa||'—')}</div><div><b>Efeito:</b> ${esc(x.efeito||'—')}</div><div><b>Quebra:</b> ${esc(x.consequencia||'—')}</div><div class="contrato-acoes"><button class="btn" type="button" onclick="editarArtefato(${i})">✏️ Editar</button><button class="btn perigo" type="button" onclick="remover('artefatos',${i})">🗑️</button></div></div>`).join('')||'<div class="nota">Nenhum artefato jurado.</div>'}
function novoArtefato(){dados.artefatos.push({nome:'',tipo:'',promessa:'',efeito:'',consequencia:'',ativo:true,corrupcao:0});editarArtefato(dados.artefatos.length-1)}
function editarArtefato(i){const x=dados.artefatos[i];const nome=prompt('Nome do artefato',x.nome||'');if(nome===null)return;x.nome=nome;x.tipo=prompt('Tipo',x.tipo||'Arma / Acessório / Objeto')||x.tipo;x.promessa=prompt('Promessa ativa',x.promessa||'')||x.promessa;x.efeito=prompt('Efeito enquanto cumprida',x.efeito||'')||x.efeito;x.consequencia=prompt('Consequência ao quebrar',x.consequencia||'')||x.consequencia;renderArtefatos()}
function renderFeridas(){const c=document.getElementById('feridas');if(!c)return;c.innerHTML=dados.feridas.map((x,i)=>`<div class="item"><h4>${esc(x.tipo||'Ferida')}</h4><div>${esc(x.descricao||'')}</div><div class="nota">Tratamento: ${esc(x.tratamento||'—')}</div><button class="btn perigo" type="button" onclick="remover('feridas',${i})">🗑️</button></div>`).join('')||'<div class="nota">Nenhuma ferida.</div>'}
function novaFerida(){const tipo=prompt('Tipo: Leve, Grave ou Mortal','Grave');if(!tipo)return;const t=TIPOS_FERIDA.find(x=>x.toLowerCase()===tipo.toLowerCase())||'Grave';dados.feridas.push({tipo:t,descricao:prompt('Descrição')||'',tratamento:prompt('Tratamento')||''});if(t==='Mortal')dados.sanidade=Math.max(0,dados.sanidade-1);renderFeridas();render()}
function renderTraumas(){const c=document.getElementById('traumas');if(!c)return;c.innerHTML=dados.traumas.map((x,i)=>`<div class="item"><h4>${esc(x.nome||x)}</h4><div class="nota">${esc(x.efeito||'Trauma persistente a interpretar.')}</div><button class="btn perigo" type="button" onclick="remover('traumas',${i})">🗑️</button></div>`).join('')||'<div class="nota">Nenhum trauma.</div>'}
function novoTrauma(){const n=prompt('Escolha um trauma: '+TRAUMAS.join(', '),'Vozes do Véu');if(!n)return;dados.traumas.push({nome:n,efeito:''});renderTraumas()}
function renderMagias(){const c=document.getElementById('magias-lista');if(!c)return;c.innerHTML=dados.magias.map((x,i)=>`<div class="item"><h4>${esc(x.nome||'Magia')}</h4><div>${esc(x.intencao||'')}</div><div class="nota">Limites: ${esc(x.limites||'')}</div><div class="nota">Último resultado: ${esc(x.resultado||'—')}</div><button class="btn" type="button" onclick="usarMagiaRegistrada(${i})">🎲 Usar</button> <button class="btn perigo" type="button" onclick="remover('magias',${i})">🗑️</button></div>`).join('')||'<div class="nota">Nenhuma magia personalizada registrada.</div>';const r=document.getElementById('magias-restantes');if(r)r.textContent=dados.magias_basicas}
function usarMagiaBasica(){if(dados.magias_basicas<=0){alert('Você já usou as 3 magias básicas da cena. Uma quarta pode ser usada com gesto/custo emocional significativo.');return}dados.magias_basicas--;renderMagias();rolarVéu('magia')}
function recuperarMagias(){dados.magias_basicas=dados.magias_basicas_max;renderMagias()}
function novoSacrificio(){const nivel=prompt('Nível do sacrifício: Leve, Médio, Forte ou Crítico','Leve');if(!nivel)return;const custo=prompt('O que será sacrificado?','');if(custo===null)return;dados.magias.push({nome:'Sacrifício '+nivel,intencao:'Amplificação de magia básica',limites:'Definidos com o Mestre',sacrificio:nivel+': '+custo});renderMagias()}
function usarMagiaRegistrada(i){const r=rolarVéu('magia');dados.magias[i].resultado=r.label;renderMagias()}
function renderInteresses(){const c=document.getElementById('interesses');if(!c)return;c.innerHTML=dados.interesse.map((x,i)=>`<div class="item"><h4>${esc(x.nome)}</h4><div>Interesse: <b>${x.pontos||0}/3</b></div><div class="toolbar"><button class="btn" type="button" onclick="dados.interesse[${i}].pontos=Math.min(3,(dados.interesse[${i}].pontos||0)+1);renderInteresses()">＋</button><button class="btn perigo" type="button" onclick="remover('interesse',${i})">🗑️</button></div></div>`).join('')||'<div class="nota">Nenhum marcador de interesse.</div>'}
function novoInteresse(){const n=prompt('NPC, contrato ou local-chave','');if(n)dados.interesse.push({nome:n,pontos:0});renderInteresses()}
function definirBatida(b){dados.batida_atual=b;render()}
function ganharImersao(){dados.pontos_imersao=Math.min(3,dados.pontos_imersao+1);render()}
function gastarImersao(){if(dados.pontos_imersao<=0){alert('Você não possui Pontos de Imersão.');return}const u=prompt('Uso: rerrolagem, bônus narrativo, insight arcano ou mitigação','rerrolagem');dados.pontos_imersao--;alert('Uso registrado: '+u);render()}
function alterarFolego(n){dados.folego=Math.max(0,Math.min(dados.folego_max,dados.folego+n));render()}
function alterarSanidade(n){dados.sanidade=Math.max(0,Math.min(dados.sanidade_max,dados.sanidade+n));if(dados.sanidade===0)colapsoMental();else render()}
function colapsoMental(){const e=['Catatonia','Paranoia','Delírio','Autodestruição','Possessão Passiva'][Math.floor(Math.random()*5)];dados.estado_critico='Colapso: '+e;dados.traumas.push({nome:'Trauma permanente do Colapso',efeito:e});dados.sanidade=3;render();alert('Colapso Mental: '+e+'\nVocê recebe 1 Trauma permanente e retorna a 3 Sanidade.')}
function testeSanidade(){const r=rolarVéu('sanidade');if(r.n===3||r.n===4||r.n===1){dados.sanidade=Math.max(0,dados.sanidade-1)}if(r.n===3){dados.traumas.push({nome:'Trauma leve',efeito:'Resultado de falha de Sanidade.'})}if(dados.sanidade===0)colapsoMental();else render()}
function testeMorte(){const r=rolarVéu('morte');alert('Teste de Vontade + Dado do Véu: '+r.label+' — '+r.texto)}
function testeMorteResultado(n){return n===1?'Fica consciente, mas em choque.':n===5?'Age por 1 rodada antes de colapsar.':n===3?'Perde consciência.':n===6?'Retoma o controle e ganha uma última ação épica.':'Resiste com efeito narrativo.'}
function testeMorte(){const r=rolarVéu('morte');alert('Resultado: '+r.label+' — '+testeMorteResultado(r.n))}
function rolarVéu(context='geral'){const n=1+Math.floor(Math.random()*6),f=FACES[n];const r={n,label:f[0]+' '+f[1],texto:f[2]};const out=document.querySelector('.resultado');if(out)out.innerHTML='<b>'+esc(r.label)+'</b><br><span class="nota">'+esc(r.texto)+'</span>';return r}
function trocarNome(){if(dados.moedas_arcantria<3){alert('São necessárias pelo menos 3 Moedas de Arcântria.');return}if(!confirm('A troca invalida promessas anteriores e reinicia Corrupção. Continuar?'))return;dados.moedas_arcantria-=3;dados.nome_verdadeiro=prompt('Novo Nome Verdadeiro','')||dados.nome_verdadeiro;dados.contratos=dados.contratos.map(x=>({...x,status:'encerrado'}));dados.pacto_interno={ativo:false,nivel:1,declaracao:'',risco:'',recompensa:'',sinal:''};dados.atributos.corrupcao=1;dados.nome_estado='renomeado na Corte de Cera';render()}
function remover(k,i){if(!Array.isArray(dados[k]))return;dados[k].splice(i,1);renderListas()}
function bind(){document.querySelectorAll('[data-k]').forEach(x=>x.addEventListener('input',()=>setNested(x.dataset.k,x.type==='number'?Number(x.value):x.value)));document.querySelectorAll('[data-attr]').forEach(x=>x.addEventListener('input',()=>dados.atributos[x.dataset.attr]=Math.max(1,Math.min(5,Number(x.value)||1))));document.querySelectorAll('[data-ent]').forEach(x=>x.addEventListener('input',()=>dados.entidade[x.dataset.ent]=x.value));document.querySelectorAll('[data-diario]').forEach(x=>x.addEventListener('input',()=>dados.diario[x.dataset.diario]=x.value));const a=document.getElementById('pacto-ativo');if(a)a.onchange=e=>dados.pacto_interno.ativo=e.target.checked;['declaracao','risco','recompensa','sinal'].forEach(k=>{const e=document.getElementById('pacto-'+k);if(e)e.oninput=ev=>dados.pacto_interno[k]=ev.target.value});const pn=document.getElementById('pacto-nivel');if(pn)pn.oninput=e=>dados.pacto_interno.nivel=Math.max(1,Math.min(4,Number(e.target.value)||1));const h=document.getElementById('historia');if(h)h.oninput=e=>dados.historia=e.target.value;const s=document.getElementById('segredos');if(s)s.oninput=e=>dados.segredos=e.target.value;const m=document.getElementById('marcas');if(m)m.oninput=e=>dados.marcas_veu=e.target.value;const ao=document.getElementById('arc-observacoes');if(ao)ao.oninput=e=>dados.arcântria.observacoes=e.target.value;const ec=document.getElementById('entidade-catalogo');if(ec)ec.onchange=e=>mostrarEntidadeCatalogo(e.target.value)}
function setNested(k,v){if(k.includes('.')){const [a,b]=k.split('.');if(!dados[a])dados[a]={};dados[a][b]=v}else dados[k]=v}
function mostrarEntidadeCatalogo(i){const e=entidadesCatalogo[Number(i)],p=document.getElementById('entidade-preview');if(!p)return;if(!e){p.textContent='Nenhuma entidade selecionada.';return}dados.entidade={...dados.entidade,nome:e.nome,nivel:e.nivel,dominio:e.dominio,corrupcao:e.corrupcao,manifestacao:e.manifestacao,promessa:e.promessa,estilo:e.estilo};p.innerHTML=`<strong>${esc(e.nome)}</strong><div class="nota">N${esc(e.nivel)} · ${esc(e.dominio)} · Corrupção ${esc(e.corrupcao)}</div><div>${esc(e.promessa)}</div><div class="nota">Manifestação: ${esc(e.manifestacao)} · Estilo: ${esc(e.estilo)}</div>`;document.querySelectorAll('[data-ent]').forEach(x=>x.value=dados.entidade[x.dataset.ent]||'')}
async function carregarEntidadesCatalogo(){try{const r=await fetch('entidades-noctavell.json');if(!r.ok)throw new Error(r.status);entidadesCatalogo=await r.json();const s=document.getElementById('entidade-catalogo');if(!s)return;s.innerHTML='<option value="">Selecione...</option>'+entidadesCatalogo.map((e,i)=>`<option value="${i}">N${esc(e.nivel)} · ${esc(e.nome)}</option>`).join('')}catch(e){console.warn(e)}}
function salvarLocal(){localStorage.setItem('noctavell_ficha',JSON.stringify(dados));alert('Ficha Noctavell salva localmente.')}
function salvar(){salvarLocal();window.parent?.postMessage({type:'cronicas-camelot-ficha-pronta',dados,modo},window.location.origin)}
window.addEventListener('message',e=>{if(e.origin!==window.location.origin)return;const m=e.data||{};if(m.type==='cronicas-camelot-carregar-ficha'&&m.dados){dados={...dados,...m.dados,atributos:{...dados.atributos,...(m.dados.atributos||{})},pacto_interno:{...dados.pacto_interno,...(m.dados.pacto_interno||{})},diario:{...dados.diario,...(m.dados.diario||{})},arcântria:{...dados.arcântria,...(m.dados.arcântria||{})}};modo=m.modo||modo;render()}if(m.type==='cronicas-camelot-carregar-sistema')window.noctavellSistema=m.sistema});
try{const x=localStorage.getItem('noctavell_ficha');if(x){const z=JSON.parse(x);dados={...dados,...z,atributos:{...dados.atributos,...(z.atributos||{})},pacto_interno:{...dados.pacto_interno,...(z.pacto_interno||{})},diario:{...dados.diario,...(z.diario||{})},arcântria:{...dados.arcântria,...(z.arcântria||{})}}}}catch(e){}
render();
</script></body></html>
