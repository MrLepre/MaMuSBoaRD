<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Noctavell — Ficha</title>
<style>
:root{--ouro:#c9a45c;--fundo:#09090c;--painel:#15141a;--borda:#3a3030;--texto:#eee8df;--muted:#a9a0a0;--vermelho:#9f3d46;--violeta:#5d4a73}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17121b 0,#09090c 55%);color:var(--texto);font-family:Georgia,'Times New Roman',serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:18px}.topo{border:1px solid var(--borda);background:linear-gradient(145deg,#17151c,#0e0d11);padding:20px;border-radius:12px;box-shadow:0 15px 35px #0008}.marca{color:var(--ouro);letter-spacing:3px;font-size:.78rem}.topo h1{margin:5px 0;font-size:2rem}.topo p{margin:5px 0;color:var(--muted)}.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.btn{background:#211d25;color:var(--texto);border:1px solid #594a42;border-radius:7px;padding:10px 13px;cursor:pointer}.btn.principal{background:#513d28;border-color:var(--ouro)}.tabs{display:flex;gap:6px;overflow:auto;padding:12px 0;position:sticky;top:0;background:#09090cf2;z-index:4}.tab{white-space:nowrap}.tab.ativo{border-color:var(--ouro);color:#f5d58d}.painel{display:none}.painel.ativo{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:var(--painel);border:1px solid var(--borda);border-radius:10px;padding:15px}.card h2,.card h3{margin-top:0;color:#e7c982}.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}.campo span{font-size:.8rem;color:var(--muted)}input,select,textarea{width:100%;background:#0d0c10;color:var(--texto);border:1px solid #493e42;border-radius:6px;padding:9px;font:inherit}textarea{min-height:85px;resize:vertical}.atributo{display:flex;justify-content:space-between;align-items:center;border:1px solid #383138;border-radius:8px;padding:10px;margin-bottom:8px}.atributo strong{color:#e3c67f}.atributo input{width:75px}.pill{display:inline-block;border:1px solid #5b4b50;border-radius:999px;padding:4px 8px;font-size:.78rem;color:#d5c5c5}.segredo{filter:blur(4px);transition:.2s}.segredo:focus,.segredo:hover{filter:none}.barra{height:10px;background:#08080a;border:1px solid #40383a;border-radius:20px;overflow:hidden}.barra i{display:block;height:100%;background:var(--vermelho)}.lista{display:grid;gap:8px}.item{padding:10px;border:1px solid #393238;border-radius:7px;background:#100f14}.contrato-card{border-color:#594a42;background:linear-gradient(145deg,#17141a,#0f0e12)}.contrato-card.selado{border-color:#8a6d36}.contrato-card.quebrado{border-color:#7d3b43;opacity:.86}.contrato-status{display:inline-block;padding:3px 8px;border-radius:999px;border:1px solid #554b4d;font-size:.72rem}.contrato-grade{color:#e5c77f}.contrato-meta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.contrato-acoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.contrato-editor{border:1px solid #4b3d3f;border-radius:10px;padding:14px;background:#0d0c10;margin-top:12px}.contrato-editor h3{margin:0 0 10px;color:#e7c982}.contrato-clausulas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.contrato-clausulas .campo{margin:0}.contrato-final{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.entidade-ref{padding:10px;border:1px solid #44393c;border-radius:8px;background:#111015}.entidade-ref strong{color:#e3c67f}@media(max-width:720px){.contrato-clausulas,.contrato-final{grid-template-columns:1fr}}.item h4{margin:0 0 5px;color:#d9bd78}.dado{font-size:1.05rem;line-height:1.6}.nota{color:var(--muted);font-size:.9rem}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.rodape{margin-top:15px;color:#776f72;font-size:.78rem;text-align:center}@media(max-width:720px){.grid,.grid3{grid-template-columns:1fr}.wrap{padding:10px}.topo h1{font-size:1.5rem}.tabs{top:0}}
</style>
</head>
<body>
<div class="wrap">
<header class="topo"><div class="marca">✡ NOCTAVELL</div><h1>Onde até a alma tem preço</h1><p>Ficha de personagem — O Véu Inferior, pactos, nomes e consequências.</p><div class="acoes"><button class="btn principal" onclick="salvar()">💾 Enviar para a Mesa</button><button class="btn" onclick="salvarLocal()">📌 Salvar local</button></div></header>
<nav class="tabs" id="tabs"></nav>
<main id="conteudo"></main>
<div class="rodape">Noctavell · ficha específica do sistema</div>
</div>
<script>
const TABS=[['identidade','✡ Identidade'],['atributos','🧠 Atributos'],['nome','🔐 Nome Verdadeiro'],['pactos','📜 Pactos'],['entidade','👁️ Entidade'],['artefatos','✠ Artefatos'],['sanidade','🧠 Sanidade'],['combate','🩸 Feridas & Fôlego'],['imersao','🎭 Imersão'],['historia','📖 História']];
const ATTR=[['presenca','Presença','Influência social e arcana.'],['vontade','Vontade','Resistência mental e espiritual.'],['instinto','Instinto','Reação, percepção e reflexo.'],['ocultismo','Ocultismo','Conhecimento de pactos, rituais e entidades.'],['corrupcao','Corrupção','Influência do Véu sobre o personagem.']];
let entidadesCatalogo=[];
let contratoEditando=-1;
let dados={nome:'',nivel:1,jogador:'',idade:'',conceito:'',nome_publico:'',nome_verdadeiro:'',protecao_nome:'',atributos:{presenca:3,vontade:3,instinto:3,ocultismo:3,corrupcao:3},pacto_interno:{ativo:false,nivel:1,declaracao:'',risco:'',recompensa:'',sinal:''},contratos:[],entidade:{nome:'',nivel:'',dominio:'',promessa:'',preco:'',termo:'',estilo:''},artefatos:[],sanidade:6,sanidade_max:6,traumas:[],folego:5,folego_max:5,feridas:[],marcas_veu:'',pontos_imersao:0,moedas_arcantria:0,magias_basicas:3,magias_sacrificio:'',historia:'',segredos:'',notas:''};
let modo='criacao';
function el(tag,html,attrs=''){return `<${tag} ${attrs}>${html}</${tag}>`}
function campo(k,label,type='text',extra=''){return `<label class="campo"><span>${label}</span><input data-k="${k}" type="${type}" value="${esc(dados[k]??'')}" ${extra}></label>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function tab(id,title,body){return `<section id="p-${id}" class="painel"><div class="card"><h2>${title}</h2>${body}</div></section>`}
function render(){
 document.getElementById('tabs').innerHTML=TABS.map((t,i)=>`<button class="btn tab ${i===0?'ativo':''}" onclick="abrir('${t[0]}',this)">${t[1]}</button>`).join('');
 const attrs=ATTR.map(([k,n,d])=>`<div class="atributo"><div><strong>${n}</strong><div class="nota">${d}</div></div><input data-attr="${k}" type="number" min="1" max="5" value="${dados.atributos[k]??1}"></div>`).join('');
 const pact=dados.pacto_interno||{};
 document.getElementById('conteudo').innerHTML=[
 tab('identidade','✡ Identidade',`<div class="grid">${campo('nome','Nome público')}${campo('nivel','Nível','number','min="1"')}${campo('jogador','Jogador')}${campo('idade','Idade')}${campo('conceito','Conceito')}${campo('notas','Notas rápidas')}</div>`),
 tab('atributos','🧠 Atributos',`<p class="nota">Na criação, o documento descreve 15 pontos distribuídos em atributos de 1 a 5.</p>${attrs}<div class="pill">Total: ${Object.values(dados.atributos).reduce((a,b)=>a+Number(b||0),0)} / 15</div>`),
 tab('nome','🔐 Nome Verdadeiro',`<div class="grid">${campo('nome_publico','Nome público')}${campo('nome_verdadeiro','Nome verdadeiro','text','class="segredo" autocomplete="off"')}${campo('protecao_nome','Forma de proteção')}</div><div class="card" style="margin-top:10px"><h3>Quando o nome é conhecido</h3><ul><li>Contratos profundos ficam mais poderosos e permanentes.</li><li>Rastreamento/compulsão funcionam sem resistência.</li><li>Maldições e selamentos dobram de intensidade.</li><li>Artefatos jurados podem ser ligados à alma.</li><li>A alma pode ser chamada por convocação arcana.</li></ul></div>`),
 tab('pactos','📜 Pactos & Contratos',`<h3>Juramento da Alma</h3><label class="check"><input id="pacto-ativo" type="checkbox" ${pact.ativo?'checked':''}> Pacto Interno ativo</label><div class="grid">${[['declaracao','Declaração'],['risco','Risco ao quebrar'],['recompensa','Recompensa'],['sinal','Sinal do Véu']].map(([k,l])=>`<label class="campo"><span>${l}</span><textarea id="pacto-${k}">${esc(pact[k]||'')}</textarea></label>`).join('')}<label class="campo"><span>Nível do Juramento (1–4)</span><input id="pacto-nivel" type="number" min="1" max="4" value="${pact.nivel||1}"></label></div><p class="nota">1 Pacto Interno ativo por vez.</p><h3>Contratos externos</h3><p class="nota">Um contrato é um documento vivo. Preencha benefício, gatilho, limites, alcance, custo, risco, proibições, validação, quebra e eventual escape clause antes de selá-lo.</p><div id="contratos" class="lista"></div><button class="btn principal" onclick="novoContrato()">📜 Criar Contrato</button><div id="editor-contrato"></div>`),
 tab('entidade','👁️ Entidade / Catálogo',`<div class="grid"><label class="campo"><span>Escolher entidade do catálogo</span><select id="entidade-catalogo"><option value="">Selecione uma entidade...</option></select></label><div id="entidade-preview" class="entidade-ref">Nenhuma entidade selecionada.</div></div><div class="grid">${[['nome','Entidade ligada'],['nivel','Nível'],['dominio','Domínio'],['promessa','Promessa / benefício'],['preco','Preço inicial'],['termo','Termo oculto'],['estilo','Estilo de contrato']].map(([k,l])=>`<label class="campo"><span>${l}</span><textarea data-ent="${k}">${esc(dados.entidade[k]||'')}</textarea></label>`).join('')}</div><p class="nota">O catálogo preserva as entidades do material de Noctavell, incluindo domínio, corrupção, manifestação, promessa e estilo de contrato.</p>`),
 tab('artefatos','✠ Artefatos Jurados',`<div id="artefatos" class="lista"></div><button class="btn" onclick="novoArtefato()">＋ Adicionar Artefato Jurado</button><p class="nota">Cada artefato precisa de Promessa Ativa, Efeito enquanto cumprida e Consequência ao quebrar.</p>`),
 tab('sanidade','🧠 Sanidade & Traumas',`<div class="grid"><label class="campo"><span>Sanidade</span><input id="sanidade" type="number" min="0" max="6" value="${dados.sanidade}"></label><label class="campo"><span>Máxima</span><input id="sanidade-max" type="number" min="1" max="6" value="${dados.sanidade_max}"></label></div><div class="barra"><i style="width:${Math.max(0,Math.min(100,(dados.sanidade/dados.sanidade_max)*100))}%"></i></div><h3>Traumas</h3><div id="traumas" class="lista"></div><button class="btn" onclick="novoTrauma()">＋ Adicionar Trauma</button><p class="nota">Sanidade começa em 6. Ao chegar a 0 ocorre Colapso Mental; após o colapso, o documento indica 1 Trauma permanente e retorno a 3 Sanidade.</p>`),
 tab('combate','🩸 Feridas & Fôlego',`<div class="grid"><label class="campo"><span>Fôlego</span><input id="folego" type="number" min="0" max="8" value="${dados.folego}"></label><label class="campo"><span>Fôlego máximo</span><input id="folego-max" type="number" min="1" max="8" value="${dados.folego_max}"></label></div><div class="barra"><i style="width:${Math.max(0,Math.min(100,(dados.folego/dados.folego_max)*100))}%"></i></div><h3>Feridas</h3><div id="feridas" class="lista"></div><button class="btn" onclick="novaFerida()">＋ Registrar Ferida</button><h3>Marcas do Véu</h3><textarea id="marcas">${esc(dados.marcas_veu||'')}</textarea>`),
 tab('imersao','🎭 Imersão & Progressão',`<div class="grid"><label class="campo"><span>Pontos de Imersão</span><input id="pontos-imersao" type="number" min="0" max="3" value="${dados.pontos_imersao}"></label><label class="campo"><span>Moedas de Arcântria</span><input id="moedas" type="number" min="0" value="${dados.moedas_arcantria}"></label><label class="campo"><span>Magias básicas restantes</span><input id="magias-basicas" type="number" min="0" max="4" value="${dados.magias_basicas}"></label></div><p class="nota">Pontos de Imersão: limite de 3 simultâneos e até 1 ganho por cena. Podem ser usados para rerrolagem, bônus narrativo, Insight Arcano ou mitigação de consequência.</p><p class="nota">Moedas de Arcântria podem ser obtidas por contratos e gastas em progressão, pactos, rituais e redução de Corrupção conforme o guia.</p>`),
 tab('historia','📖 História',`<label class="campo"><span>História do personagem</span><textarea id="historia" style="min-height:220px">${esc(dados.historia||'')}</textarea></label><label class="campo"><span>Segredos</span><textarea id="segredos">${esc(dados.segredos||'')}</textarea></label>`)
 ].join('');
 renderListas(); bind();
}
function abrir(id,b){document.querySelectorAll('.painel').forEach(x=>x.classList.remove('ativo'));document.getElementById('p-'+id)?.classList.add('ativo');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('ativo'));b?.classList.add('ativo')}
function renderListas(){
 const c=document.getElementById('contratos');
 if(c)c.innerHTML=(dados.contratos||[]).map((x,i)=>{const status=x.status||'rascunho';const cls=status==='selado'?'selado':status==='quebrado'?'quebrado':'';return `<div class="item contrato-card ${cls}"><h4>${esc(x.nome||'Contrato sem nome')}</h4><div class="contrato-meta"><span class="contrato-grade">Grau ${esc(x.grau||'I')}</span><span class="contrato-status">${status==='selado'?'🔒 Selado':status==='quebrado'?'💥 Quebrado':'✍️ Rascunho'}</span>${x.entidade?`<span class="contrato-status">👁️ ${esc(x.entidade)}</span>`:''}</div><div class="nota">${esc(x.beneficio||x.clausula||'Sem benefício definido.')}</div><div class="nota">Preço: ${esc(x.preco||'—')} · Prazo: ${esc(x.prazo||'—')} · Quebra: ${esc(x.quebra||'—')}</div><div class="contrato-acoes"><button class="btn" type="button" onclick="editarContrato(${i})">✏️ Abrir contrato</button>${status!=='selado'?`<button class="btn" type="button" onclick="selarContrato(${i})">🔒 Selar</button>`:''}${status==='selado'?`<button class="btn" type="button" onclick="quebrarContrato(${i})">💥 Registrar quebra</button>`:''}<button class="btn" type="button" onclick="remover('contratos',${i})">🗑️</button></div></div>`}).join('')||'<div class="nota">Nenhum contrato registrado.</div>';
 document.getElementById('artefatos').innerHTML=(dados.artefatos||[]).map((x,i)=>`<div class="item"><h4>${esc(x.nome||'Artefato Jurado')}</h4><div>${esc(x.tipo||'Objeto')}</div><div><b>Promessa:</b> ${esc(x.promessa||'')}</div><div><b>Efeito:</b> ${esc(x.efeito||'')}</div><div><b>Quebra:</b> ${esc(x.quebra||'')}</div><button class="btn" onclick="editarArtefato(${i})">✏️</button> <button class="btn" onclick="remover('artefatos',${i})">🗑️</button></div>`).join('')||'<div class="nota">Nenhum artefato registrado.</div>';
 document.getElementById('traumas').innerHTML=(dados.traumas||[]).map((x,i)=>`<div class="item"><h4>${esc(x.nome||'Trauma')}</h4><div>${esc(x.efeito||'')}</div><button class="btn" onclick="remover('traumas',${i})">🗑️</button></div>`).join('')||'<div class="nota">Nenhum trauma registrado.</div>';
 document.getElementById('feridas').innerHTML=(dados.feridas||[]).map((x,i)=>`<div class="item"><h4>${esc(x.tipo||'Ferida')}</h4><div>${esc(x.descricao||'')}</div><div class="nota">Tratamento: ${esc(x.tratamento||'')}</div><button class="btn" onclick="remover('feridas',${i})">🗑️</button></div>`).join('')||'<div class="nota">Nenhuma ferida registrada.</div>';
 if(contratoEditando>=0)renderEditorContrato(contratoEditando);
}
function contratoVazio(){return {nome:'',grau:'I',entidade:'',portador:'',testemunhas:'',local_data:'',beneficio:'',gatilho:'',limites:'',alcance:'',custo:'',risco:'',proibicoes:'',validacao:'',quebra:'',excecoes:'',preco:'',prazo:'',status:'rascunho',clausula:'',termo:''};}
function novoContrato(){dados.contratos.push(contratoVazio());contratoEditando=dados.contratos.length-1;renderListas();renderEditorContrato(contratoEditando)}
function editarContrato(i){contratoEditando=i;renderEditorContrato(i)}
function campoContrato(k,label,valor,area=true){return `<label class="campo"><span>${label}</span>${area?`<textarea data-contrato-k="${k}">${esc(valor||'')}</textarea>`:`<input data-contrato-k="${k}" value="${esc(valor||'')}">`}</label>`}
function renderEditorContrato(i){const x=dados.contratos[i];const box=document.getElementById('editor-contrato');if(!box||!x)return;box.innerHTML=`<div class="contrato-editor"><h3>📜 Documento do Contrato</h3><div class="grid">${campoContrato('nome','Nome do contrato',x.nome,false)}<label class="campo"><span>Grau</span><select data-contrato-k="grau">${['I','II','III','IV','V'].map(g=>`<option ${x.grau===g?'selected':''}>${g}</option>`).join('')}</select></label>${campoContrato('entidade','Entidade',x.entidade,false)}${campoContrato('portador','Portador',x.portador,false)}${campoContrato('testemunhas','Testemunhas',x.testemunhas,false)}${campoContrato('local_data','Local / Data',x.local_data,false)}</div><h3>CLÁUSULAS</h3><div class="contrato-clausulas">${campoContrato('beneficio','1) Benefício prometido',x.beneficio)}${campoContrato('gatilho','2) Gatilho',x.gatilho)}${campoContrato('limites','3) Limites',x.limites)}${campoContrato('alcance','4) Alvos / alcance',x.alcance)}${campoContrato('custo','5) Custo',x.custo)}${campoContrato('risco','6) Risco',x.risco)}${campoContrato('proibicoes','7) Proibições',x.proibicoes)}${campoContrato('validacao','8) Prova / validação',x.validacao)}${campoContrato('quebra','9) Quebra',x.quebra)}${campoContrato('excecoes','10) Exceções / escape clause',x.excecoes)}</div><h3>FECHAMENTO</h3><div class="contrato-final">${campoContrato('preco','Preço',x.preco)}${campoContrato('prazo','Prazo',x.prazo)}<label class="campo"><span>Status</span><select data-contrato-k="status"><option value="rascunho" ${x.status==='rascunho'?'selected':''}>Rascunho</option><option value="selado" ${x.status==='selado'?'selected':''}>Selado</option><option value="quebrado" ${x.status==='quebrado'?'selected':''}>Quebrado</option></select></label></div><div class="contrato-acoes"><button class="btn principal" type="button" onclick="salvarContratoEditor()">💾 Salvar contrato</button><button class="btn" type="button" onclick="fecharEditorContrato()">Fechar</button></div></div>`;box.querySelectorAll('[data-contrato-k]').forEach(e=>e.addEventListener('input',()=>{x[e.dataset.contratoK]=e.value}));}
function salvarContratoEditor(){if(contratoEditando<0)return;const x=dados.contratos[contratoEditando];x.clausula=x.beneficio||'';x.termo=x.excecoes||'';renderListas();renderEditorContrato(contratoEditando)}
function fecharEditorContrato(){contratoEditando=-1;const b=document.getElementById('editor-contrato');if(b)b.innerHTML='';renderListas()}
function selarContrato(i){const x=dados.contratos[i];const campos=['nome','entidade','beneficio','gatilho','limites','alcance','custo','risco','proibicoes','validacao','quebra','preco','prazo'];const faltam=campos.filter(k=>!String(x[k]||'').trim());if(faltam.length){alert('Preencha as cláusulas essenciais antes de selar o contrato.');editarContrato(i);return}if(!confirm('Selar este contrato? Depois disso ele ficará marcado como ativo.'))return;x.status='selado';renderListas()}
function quebrarContrato(i){const x=dados.contratos[i];if(!confirm('Registrar a quebra deste contrato?'))return;x.status='quebrado';renderListas()}
function novoArtefato(){dados.artefatos.push({nome:'',tipo:'',promessa:'',efeito:'',quebra:''});editarArtefato(dados.artefatos.length-1)}
function editarArtefato(i){let x=dados.artefatos[i];let n=prompt('Nome do artefato',x.nome||'');if(n===null)return;x.nome=n;x.tipo=prompt('Tipo',x.tipo||'')??x.tipo;x.promessa=prompt('Promessa ativa',x.promessa||'')??x.promessa;x.efeito=prompt('Efeito enquanto cumprido',x.efeito||'')??x.efeito;x.quebra=prompt('Consequência ao quebrar',x.quebra||'')??x.quebra;renderListas()}
function novoTrauma(){let n=prompt('Nome do trauma');if(!n)return;let e=prompt('Efeito narrativo')||'';dados.traumas.push({nome:n,efeito:e});renderListas()}
function novaFerida(){let t=prompt('Tipo: Leve, Grave ou Mortal');if(!t)return;let d=prompt('Descrição')||'';let tr=prompt('Tratamento')||'';dados.feridas.push({tipo:t,descricao:d,tratamento:tr});renderListas()}
function remover(k,i){dados[k].splice(i,1);renderListas()}
function bind(){const ec=document.getElementById('entidade-catalogo');if(ec)ec.onchange=e=>mostrarEntidadeCatalogo(e.target.value);document.querySelectorAll('[data-k]').forEach(x=>x.addEventListener('input',()=>dados[x.dataset.k]=x.type==='number'?Number(x.value):x.value));document.querySelectorAll('[data-attr]').forEach(x=>x.addEventListener('input',()=>dados.atributos[x.dataset.attr]=Number(x.value)));document.querySelectorAll('[data-ent]').forEach(x=>x.addEventListener('input',()=>dados.entidade[x.dataset.ent]=x.value));document.getElementById('pacto-ativo').onchange=e=>dados.pacto_interno.ativo=e.target.checked;['declaracao','risco','recompensa','sinal'].forEach(k=>document.getElementById('pacto-'+k).oninput=e=>dados.pacto_interno[k]=e.target.value);document.getElementById('pacto-nivel').oninput=e=>dados.pacto_interno.nivel=Number(e.target.value);document.getElementById('sanidade').oninput=e=>dados.sanidade=Number(e.target.value);document.getElementById('sanidade-max').oninput=e=>dados.sanidade_max=Number(e.target.value);document.getElementById('folego').oninput=e=>dados.folego=Number(e.target.value);document.getElementById('folego-max').oninput=e=>dados.folego_max=Number(e.target.value);document.getElementById('marcas').oninput=e=>dados.marcas_veu=e.target.value;document.getElementById('pontos-imersao').oninput=e=>dados.pontos_imersao=Number(e.target.value);document.getElementById('moedas').oninput=e=>dados.moedas_arcantria=Number(e.target.value);document.getElementById('magias-basicas').oninput=e=>dados.magias_basicas=Number(e.target.value);document.getElementById('historia').oninput=e=>dados.historia=e.target.value;document.getElementById('segredos').oninput=e=>dados.segredos=e.target.value}

async function carregarEntidadesCatalogo(){try{const r=await fetch('entidades-noctavell.json');if(!r.ok)throw new Error('HTTP '+r.status);entidadesCatalogo=await r.json();const sel=document.getElementById('entidade-catalogo');if(!sel)return;sel.innerHTML='<option value="">Selecione uma entidade...</option>'+entidadesCatalogo.map((e,i)=>`<option value="${i}">N${esc(e.nivel)} · ${esc(e.nome)}</option>`).join('');const atual=entidadesCatalogo.findIndex(e=>String(e.nome).toLowerCase()===String(dados.entidade.nome||'').toLowerCase());if(atual>=0){sel.value=String(atual);mostrarEntidadeCatalogo(atual)}}catch(e){console.warn('Catálogo de entidades não carregado',e)}}
function mostrarEntidadeCatalogo(i){const e=entidadesCatalogo[Number(i)];const p=document.getElementById('entidade-preview');if(!p)return;if(!e){p.textContent='Nenhuma entidade selecionada.';return}dados.entidade={...dados.entidade,nome:e.nome,nivel:e.nivel,dominio:e.dominio,promessa:e.promessa,preco:e.estilo||'',estilo:e.estilo};p.innerHTML=`<strong>${esc(e.nome)}</strong><div class="nota">Nível ${esc(e.nivel)} · ${esc(e.dominio)}</div><div>${esc(e.promessa)}</div><div class="nota">Corrupção: ${esc(e.corrupcao)} · Manifestação: ${esc(e.manifestacao)}</div>`;document.querySelectorAll('[data-ent]').forEach(x=>x.value=dados.entidade[x.dataset.ent]||'')}
function salvarLocal(){localStorage.setItem('noctavell_ficha',JSON.stringify(dados));alert('Ficha salva localmente.')}
function salvar(){salvarLocal();window.parent?.postMessage({type:'cronicas-camelot-ficha-pronta',dados,modo},window.location.origin)}
window.addEventListener('message',e=>{if(e.origin!==window.location.origin)return;const m=e.data||{};if(m.type==='cronicas-camelot-carregar-ficha'&&m.dados){dados={...dados,...m.dados,atributos:{...dados.atributos,...(m.dados.atributos||{})},pacto_interno:{...dados.pacto_interno,...(m.dados.pacto_interno||{})}};modo=m.modo||modo;render()}if(m.type==='cronicas-camelot-carregar-sistema'){/* sistema recebido pelo VTT */}});
try{const x=localStorage.getItem('noctavell_ficha');if(x)dados={...dados,...JSON.parse(x),contratos:Array.isArray(JSON.parse(x).contratos)?JSON.parse(x).contratos:[]}}catch(e){}render();carregarEntidadesCatalogo();
</script>
</body></html>
