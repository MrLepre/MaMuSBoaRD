<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sobreviventes da Fronteira</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d0b;--panel:#131814;--panel2:#0d120f;--gold:#c6a15b;--gold2:#f0d38a;--red:#a94d42;--red2:#e07b68;--green:#83b89a;--blue:#7da8c9;--text:#eee9dd;--muted:#a8aa9f;--line:#3e463e}*{box-sizing:border-box}body{margin:0;padding:8px;background:radial-gradient(circle at 50% 0,#273126 0,#090c0a 60%);color:var(--text);font-family:'EB Garamond',serif;overflow-x:hidden}.ficha{max-width:1180px;margin:auto;background:rgba(12,16,13,.98);border:2px solid var(--gold);border-radius:10px;padding:15px;box-shadow:0 0 35px #000}.top{text-align:center;border-bottom:1px solid var(--gold);padding-bottom:11px;margin-bottom:10px}.top h1{font-family:Cinzel;color:var(--gold2);margin:0;font-size:1.9rem}.top p{margin:4px;color:#d7c58e}.tabs{position:sticky;top:0;z-index:20;display:flex;gap:5px;overflow:auto;padding:7px 0;background:rgba(12,16,13,.97);border-bottom:1px solid #30372f;margin-bottom:12px}.btn{background:#201a10;color:var(--gold2);border:1px solid var(--gold);border-radius:5px;padding:8px 10px;font:inherit;font-weight:700;cursor:pointer}.btn:hover{filter:brightness(1.12)}.btn-danger{border-color:var(--red2);color:#ffd0c8;background:#24110f}.btn-blue{border-color:var(--blue);color:#cfe6f8;background:#101a22}.tab-btn.active{background:#463617;border-color:var(--gold2)}.tab-pane{display:none}.tab-pane.active{display:block}.bloco{border:1px solid var(--line);border-radius:7px;background:linear-gradient(135deg,#171c17,#0b0f0c);padding:12px;margin-bottom:12px}.bloco h2{font-family:Cinzel;color:var(--gold2);font-size:1.02rem;border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr));gap:8px}.campo{min-width:0}.campo label{display:block;color:#e5c980;font-weight:700;margin-bottom:3px}.campo small{display:block;color:var(--muted);font-size:.78rem;margin-top:3px}.campo input,.campo select,.campo textarea{width:100%;padding:8px;background:#070a08;color:#f5f0e6;border:1px solid #485048;border-radius:4px;font:inherit}.campo textarea{resize:vertical;min-height:78px}.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 7px #c6a15b33}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{padding:9px;border:1px solid #485048;border-radius:6px;text-align:center;background:#090c0a}.stat span{display:block;color:var(--muted);font-size:.78rem}.stat strong{font-size:1.35rem;color:var(--gold2)}.attrs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.attr{border:1px solid #485048;border-radius:7px;background:#090c0a;padding:9px}.attr strong{display:block;color:var(--gold2);font-family:Cinzel}.attr input{width:100%;margin-top:5px;padding:8px;text-align:center;background:#070a08;color:#fff;border:1px solid #485048;border-radius:4px;font-weight:700}.mod{margin-top:5px;text-align:center;color:var(--blue);font-weight:700}.note{padding:9px 10px;border-left:3px solid var(--blue);background:#0c151b;color:#cfe0ec;border-radius:4px}.warn{padding:9px 10px;border-left:3px solid var(--red2);background:#1a100e;color:#f0c3b9;border-radius:4px}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid #4b514b;border-radius:999px;padding:5px 9px;background:#090c0a;color:#ddd0ad}.list{display:grid;gap:8px}.rowcard{border:1px solid #485048;border-radius:7px;padding:10px;background:#090c0a}.rowcard h3{margin:0 0 5px;color:var(--gold2);font-family:Cinzel;font-size:.95rem}.rowcard p{margin:4px 0;color:#d2d3cc}.rule-table{width:100%;border-collapse:collapse;font-size:.88rem}.rule-table th,.rule-table td{border:1px solid #414841;padding:6px;text-align:left;vertical-align:top}.rule-table th{color:var(--gold2);background:#17140e}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.hidden{display:none!important}.tag{font-size:.75rem;padding:2px 6px;border:1px solid #555;border-radius:999px;color:#cfd2c8}.roll-result{font-size:1.15rem;color:var(--gold2);font-weight:700}.section-actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px}@media(max-width:900px){.attrs{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){body{padding:4px}.ficha{padding:8px}.top h1{font-size:1.35rem}.grid,.attrs,.cards{grid-template-columns:1fr!important}.actions .btn,.section-actions .btn{width:100%}}
@media print{body{background:#fff;color:#111}.ficha{border:0;box-shadow:none;max-width:none;background:#fff}.tabs,.actions,.btn{display:none!important}.tab-pane{display:block!important}.bloco,.rowcard,.attr{break-inside:avoid;background:#fff;border-color:#aaa}.campo input,.campo select,.campo textarea,.attr input{color:#111;background:#fff;border-color:#aaa}.top h1,.bloco h2,.campo label,.attr strong{color:#5d4411}}

.orbit-map{position:relative;max-width:900px;height:520px;margin:12px auto;border:1px solid #485048;border-radius:10px;background:radial-gradient(circle at center,#25251e 0 8%,#11150f 28%,#090c0a 72%);overflow:hidden}.orbit-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.orbit-lines line{stroke:#6e6144;stroke-width:2;stroke-dasharray:7 6;opacity:.75}.orbit-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:170px;height:105px;border:2px solid var(--red2);border-radius:50%;background:#1a100e;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:3;box-shadow:0 0 28px #000}.orbit-center strong{color:#ffd0c8;font-family:Cinzel;font-size:.9rem}.orbit-center small{color:#d6b6ad;margin-top:4px}.orbit-node{position:absolute;z-index:4;width:180px;min-height:72px;border:1px solid var(--gold);border-radius:10px;background:#17140e;color:var(--gold2);font-family:Cinzel;font-weight:700;line-height:1.15;padding:12px 8px;cursor:pointer}.orbit-node:hover,.orbit-node:focus{border-color:#fff0b0;filter:brightness(1.15);outline:none}.orbit-node.active{background:#493719;border-color:#fff0b0;box-shadow:0 0 18px #c6a15b44}.orbit-norte{left:calc(50% - 90px);top:25px}.orbit-noroeste{left:55px;top:105px}.orbit-sudoeste{left:55px;bottom:45px}.orbit-nordeste{right:55px;top:105px}.orbit-sudeste{right:55px;bottom:45px}@media(max-width:650px){.orbit-map{height:600px}.orbit-node{width:145px;font-size:.78rem}.orbit-norte{left:calc(50% - 72px);top:22px}.orbit-noroeste{left:10px;top:145px}.orbit-sudoeste{left:10px;bottom:75px}.orbit-nordeste{right:10px;top:145px}.orbit-sudeste{right:10px;bottom:75px}.orbit-center{width:145px;height:95px}}
</style></head><body><div class="ficha"><div class="top"><h1>🛡️ Sobreviventes da Fronteira</h1><p id="subtitulo">A panela bate. O dia reseta. A memória permanece.</p></div><nav class="tabs" id="tabs"></nav><div id="conteudo">Carregando...</div><div class="actions"><button class="btn" type="button" onclick="enviar()">⚔️ Enviar para a Mesa</button><button class="btn" type="button" onclick="salvarLocal()">💾 Salvar rascunho</button><button class="btn" type="button" onclick="carregarLocal()">↩️ Recuperar rascunho</button><button class="btn" type="button" onclick="window.print()">📜 Imprimir / PDF</button></div></div>

const ORBITA_MATRIZ={titulo:'ÓRBITAS DA MATRIZ: FREQUÊNCIAS DO SOBREVIVENTE',regra_geral:'NÃO UTILIZE FORMATOS HEXAGONAIS',centro:{nome:'O NÚCLEO VAZIO (EIXO DISTORCIDO)'},frequencias_perifericas:[{nome:'SUPREMACIA CORPOREAL',posicao_visual:'Topo / Norte',verbo:'Envolver / Reforçar',atributos:'CON / FOR',descricao:'Amplifica propriedades físicas e estruturais de algo que já existe e está em contato direto com o usuário.',conexoes:[['ALQUIMIA VIBRACIONAL',1,'Afinidade Vizinhança'],['PROJEÇÃO VETORIAL',1,'Afinidade Vizinhança'],['ARQUITETURA CONVENIENTE',2,'Afinidade Distante'],['PULSO DE SUBMISSÃO',2,'Afinidade Distante']]},{nome:'ALQUIMIA VIBRACIONAL',posicao_visual:'Esquerda Superior / Noroeste',verbo:'Mimetizar / Modular',atributos:'FUR / INT',descricao:'Altera a vibração e a assinatura do mana para mimetizar propriedades químicas ou elementais.',conexoes:[['SUPREMACIA CORPOREAL',1,'Afinidade Vizinhança'],['ARQUITETURA CONVENIENTE',1,'Afinidade Vizinhança'],['PROJEÇÃO VETORIAL',2,'Afinidade Distante']]},{nome:'ARQUITETURA CONVENIENTE',posicao_visual:'Esquerda Inferior / Sudoeste',verbo:'Solidificar / Fixar',atributos:'INT',descricao:'Condensa gases, poeira e Miasma para dar forma física, peso, textura e permanência ao mana.',conexoes:[['ALQUIMIA VIBRACIONAL',1,'Afinidade Vizinhança'],['SUPREMACIA CORPOREAL',2,'Afinidade Distante'],['PULSO DE SUBMISSÃO',2,'Afinidade Distante']]},{nome:'PROJEÇÃO VETORIAL',posicao_visual:'Direita Superior / Nordeste',verbo:'Projetar / Afrestar',atributos:'PER / AGI',descricao:'Destaca o mana do corpo e o conduz por vetores à distância, mantendo sua integridade.',conexoes:[['SUPREMACIA CORPOREAL',1,'Afinidade Vizinhança'],['PULSO DE SUBMISSÃO',1,'Afinidade Vizinhança'],['ALQUIMIA VIBRACIONAL',2,'Afinidade Distante']]},{nome:'PULSO DE SUBMISSÃO',posicao_visual:'Direita Inferior / Sudeste',verbo:'Subjugar / Vincular',atributos:'VON',descricao:'Emite ondas e filamentos de mana que interceptam, controlam e sobrescrevem organismos e fluxos de objetos.',conexoes:[['PROJEÇÃO VETORIAL',1,'Afinidade Vizinhança'],['SUPREMACIA CORPOREAL',2,'Afinidade Distante'],['ARQUITETURA CONVENIENTE',2,'Afinidade Distante']]}]};
const ORBITAS={1:['Envolver / Reforçar','CON / FOR','Supremacia Corpórea'],2:['Projetar / Afrestar','PER / AGI','Projeção Vetorial'],3:['Subjugar / Vincular','VON','Pulso de Submissão'],4:['Solidificar / Fixar','INT','Arquitetura Conveniente'],5:['Mimetizar / Modular','FUR / INT','Alquimia Vibracional'],6:['Núcleo Vazio','Loucura / Memória','O Núcleo Vazio (Eixo Distorcido)']};
const ORBITA_BY_NAME=Object.fromEntries(ORBITA_MATRIZ.frequencias_perifericas.map(x=>[x.nome,x]));
const CONCEITOS={
1:['Fogo','Água','Terra','Ar','Eletricidade','Natureza'],2:['Gelo','Fumaça','Madeira','Metal','Vácuo','Carne'],3:['Ira','Medo','Apatia','Empatia','Orgulho','Tristeza'],4:['Passado','Futuro','Portal','Barreira','Cosmos','Espelho'],5:['Visão','Audição','Dor','Silêncio','Mente','Sexto Sentido'],6:['Coração','Osso','Ácido','Sono','Doença','Rastro'],7:['Lâmina','Escudo','Pergaminho','Chave','Amuleto','Vela'],8:['Sol','Lua','Sombra','Pureza','Cortejo','Máscara'],9:['Sorte','Equilíbrio','Explosão','Atração','Ruptura','Ciclo']};
const ARMADURAS=[['Trapos de Recruta','+0','Ilimitado','Nenhuma penalidade.'],['Couro de Cervo (Krais)','+2','+4','Leve e flexível.'],['Brigandina de Infantaria','+4','+2','Desvantagem em Furtividade.'],['Cota de Malha Pesada','+6','+1','Desvantagem em Furtividade e Acrobacia.'],['Placas Colossais','+8','+0','Exige FOR 4+; deslocamento -3m.']];
const ARMAS=[['Leves','1d4 ou 1d6','AGI / FUR','Acuidade; soma AGI no dano; fáceis de ocultar.'],['Militares','1d8 ou 1d10','FOR','Versátil; duas mãos aumenta o dado em um degrau.'],['Colossais','1d12 ou 2d6','FOR','Exige FOR 4+; pesada; causa dano de impacto na Postura.']];
const MODS=[['Lâmina Retrátil',15,'Armas leves; vantagem em Furtividade para ocultar; +2 dano no primeiro ataque.'],['Contra-peso Balanceado',30,'Militares/Colossais; ignora penalidade de FOR abaixo da exigência.'],['Injetor de Toxinas',25,'Aplicar veneno como Reação em vez de Ação Bônus.'],['Canalizador Rúnico',40,'Infunde PM na arma; dano mágico/elemental por 3 rodadas.'],['Liga de Ferro-Frio',50,'Ignora RD de monstros do Miasma e mortos-vivos.']];
const TABS=[['identidade','🪪 Identidade'],['atributos','🧬 Atributos'],['linhagem','🧱 Linhagem'],['combate','⚔️ Combate'],['ciclo','🌀 Ciclo & Memória'],['orbita','🌌 Órbita / Matriz'],['tecnicas','✨ Técnicas'],['equipamentos','🛡️ Equipamentos'],['treino','🏕️ Treinamento'],['historia','📜 História']];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d}function val(id){return document.getElementById(id)?.value??''}function set(id,v){const e=document.getElementById(id);if(e)e.value=v??''}function mod(a,g){const v=num(a,0);const teto=g<=5?3:g<=10?5:g<=15?8:g<=19?12:Infinity;return Math.min(v,teto)}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([id,n])=>`<button class="btn tab-btn" type="button" data-tab="${id}">${n}</button>`).join('');document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>abrirAba(b.dataset.tab)))}
function abrirAba(id){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='tab_'+id));localStorage.setItem('sobreviventes_ultima_aba',id)}
function render(){renderTabs();const nivel=num(dados.nivel,1),grau=num(dados.grau_linhagem,1),xp=num(dados.xp_atual,0),raca=dados.raca||'Humano',classe=dados.classe||'Pioneiro';const orbit=dados.orbita_primaria||'';const attrHtml=ATTR.map(([a,n])=>`<div class="attr"><strong>${n}</strong><input id="attr_${a}" type="number" min="0" value="${esc(dados['attr_'+a]??0)}"><div class="mod">Mod. Grau: <span id="mod_${a}">${mod(dados['attr_'+a],grau)}</span></div></div>`).join('');const xpNext=nivel>=20?'Máximo':100*Math.pow(2,Math.max(0,nivel-1));
let orbitOptions=Object.entries(ORBITAS).map(([k,v])=>`<option value="${k}">${k} — ${v[0]}</option>`).join('');
let conceitoHtml=Object.entries(CONCEITOS).map(([k,v])=>`<div class="rowcard"><h3>Dado ${k}</h3><p>${v.join(' · ')}</p></div>`).join('');
let armHtml=ARMADURAS.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('');let armaHtml=ARMAS.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('');let modHtml=MODS.map(x=>`<tr><td>${x[0]}</td><td>${x[1]} Pratas</td><td>${x[2]}</td></tr>`).join('');
document.getElementById('conteudo').innerHTML=`
<section id="tab_identidade" class="tab-pane"><div class="bloco"><h2>🪪 Identidade</h2><div class="grid" style="--cols:3"><div class="campo"><label>Nome</label><input id="nome" value="${esc(dados.nome||'')}"></div><div class="campo"><label>Raça</label><select id="raca">${Object.keys(RACAS).map(x=>`<option ${x===raca?'selected':''}>${x}</option>`).join('')}</select></div><div class="campo"><label>Classe</label><select id="classe">${Object.keys(CLASSES).map(x=>`<option ${x===classe?'selected':''}>${x}</option>`).join('')}</select></div><div class="campo"><label>Nível</label><input id="nivel" type="number" min="1" max="20" value="${nivel}"></div><div class="campo"><label>Grau de Linhagem</label><input id="grau_linhagem" type="number" min="1" max="20" value="${grau}"></div><div class="campo"><label>XP atual</label><input id="xp_atual" type="number" min="0" value="${xp}"></div><div class="campo"><label>Órbita Primária</label><select id="orbita_primaria"><option value="">Selecione / role 1d6</option>${orbitOptions}</select></div></div><div id="raca_info" class="note" style="margin-top:9px"></div><div id="classe_info" class="note" style="margin-top:8px"></div><div class="section-actions" style="margin-top:9px"><button class="btn btn-blue" type="button" id="btn_orbita">🎲 Rolar Órbita Primária (1d6)</button></div><div id="orbita_result" class="roll-result"></div></div><div class="bloco"><h2>📊 Recursos</h2><div class="grid" style="--cols:4"><div class="campo"><label>PV atual</label><input id="pv" type="number" value="${num(dados.pv,0)}"></div><div class="campo"><label>PV máximo</label><input id="pv_max" type="number" value="${num(dados.pv_max,0)}"></div><div class="campo"><label>PF — Fadiga</label><input id="pf" type="number" value="${num(dados.pf,0)}"></div><div class="campo"><label>PM — Mana</label><input id="pm" type="number" value="${num(dados.pm,0)}"></div></div><small class="muted">PF máximo = 10 + (CON + VON) × 2. PM máximo = 10 + (INT + VON) × 2.</small></div></section>
<section id="tab_atributos" class="tab-pane"><div class="bloco"><h2>🧬 Sete Atributos</h2><div class="attrs">${attrHtml}</div><div class="note" style="margin-top:9px"><strong>Regra 1:1:</strong> o valor puro do atributo é seu modificador nativo. O modificador aplicado em testes é limitado pelo teto do Grau de Linhagem.</div></div><div class="bloco"><h2>🎲 Teste</h2><div class="grid" style="--cols:3"><div class="campo"><label>Atributo</label><select id="teste_attr">${ATTR.map(([a,n])=>`<option value="${a}">${n}</option>`).join('')}</select></div><div class="campo"><label>CD / Defesa</label><input id="teste_cd" type="number" value="10"></div><div class="campo"><label>Observação</label><input id="teste_obs" value=""></div></div><button class="btn btn-blue" type="button" onclick="rolarTeste()">🎲 Rolar 1d20 + atributo limitado</button><p id="teste_result" class="roll-result"></p></div></section>
<section id="tab_linhagem" class="tab-pane"><div class="bloco"><h2>🧱 Gargalo do Grau</h2><table class="rule-table"><tr><th>Graus</th><th>Título</th><th>Teto</th><th>Regra</th></tr><tr><td>1–5</td><td>Soldado Raso</td><td>+3</td><td>Qualquer atributo 4–5 opera como +3.</td></tr><tr><td>6–10</td><td>Escudeiro</td><td>+5</td><td>Atributos 6–8 operam como +5; 1–5 normalmente.</td></tr><tr><td>11–15</td><td>Proto-Cavaleiro</td><td>+8</td><td>Atributos 9–12 operam como +8; 1–8 normalmente.</td></tr><tr><td>16–19</td><td>Cavaleiro da Fronteira</td><td>+12</td><td>Atributos acima de 12 operam como +12.</td></tr><tr><td>20</td><td>O Ápice</td><td>Ilimitado</td><td>O gargalo deixa de existir; reservado a lendas e deuses.</td></tr></table></div><div class="bloco"><h2>🏰 Rompimento da Muralha</h2><table class="rule-table"><tr><th>Transição</th><th>Muralha</th><th>Treinos</th><th>Requisito</th></tr><tr><td>5 → 6</td><td>Muralha de Aço</td><td>50</td><td>1 atributo em 5</td></tr><tr><td>10 → 11</td><td>Barreira Biológica</td><td>100</td><td>1 atributo em 8</td></tr><tr><td>15 → 16</td><td>Muralha Conceitual</td><td>200</td><td>1 atributo em 12</td></tr></table><p class="note" style="margin-top:9px">Subir dentro do mesmo título custa <strong>Grau Atual × 5 Treinos</strong>. O treino de acampamento consome 2 horas de preparação.</p></div><div class="bloco"><h2>📈 Nível & XP</h2><div class="cards"><div class="stat"><span>Nível</span><strong>${nivel}</strong></div><div class="stat"><span>XP</span><strong>${xp}</strong></div><div class="stat"><span>Próximo nível</span><strong>${xpNext}</strong></div><div class="stat"><span>Grau</span><strong>${grau}</strong></div></div><p class="note" style="margin-top:9px">O manual estabelece Nível 1–20 e XP por inimigos/missões; não fixa na seção recebida uma tabela numérica de XP, então o campo fica manual na ficha.</p></div></section>
<section id="tab_combate" class="tab-pane"><div class="bloco"><h2>⚔️ Economia de Ações</h2><div class="pills"><span class="pill">Ação Principal</span><span class="pill">Ação de Movimento</span><span class="pill">Ação Bônus</span><span class="pill">Reação</span></div></div><div class="bloco"><h2>🛡️ CA & Postura</h2><div class="grid" style="--cols:4"><div class="campo"><label>CA manual</label><input id="ca" type="number" value="${num(dados.ca,10)}"></div><div class="campo"><label>Bônus de Armadura</label><input id="bonus_armadura" type="number" value="${num(dados.bonus_armadura,0)}"></div><div class="campo"><label>Bônus de Escudo</label><input id="bonus_escudo" type="number" value="${num(dados.bonus_escudo,0)}"></div><div class="campo"><label>Postura atual</label><input id="postura" type="number" value="${num(dados.postura,0)}"></div></div><p class="note" style="margin-top:9px">CA = 10 + Modificador de Agilidade + Armadura + Escudo + Bônus Racial. Postura máxima = Constituição + Vontade.</p><p class="warn">Quando Postura chega a 0: Guarda Quebrada, CA -4, sem Reações e Assassino Mecânico/Ladino podem obter crítico automático.</p></div><div class="bloco"><h2>💥 Críticos</h2><p><strong>20 natural:</strong> ignora CA, dobra dados de dano, zera Postura e concede +1 Memória ao fim da cena.</p><p><strong>1 natural:</strong> falha automática, arma presa ou Refluxo de magia, +1 Estresse temporário.</p></div><div class="bloco"><h2>❤️ Vida & Recursos</h2><p>PV nível 1 = valor máximo do DV da classe + CON + bônus racial. Nos níveis seguintes, DV (ou média arredondada para cima) + CON.</p><p>PF máximo = 10 + (CON + VON) × 2. PM máximo = 10 + (INT + VON) × 2. Ao chegar a 0 PF ou PM em combate: <strong>Exausto</strong>.</p></div></section>
<section id="tab_ciclo" class="tab-pane"><div class="bloco"><h2>🌀 Retorno</h2><div class="grid" style="--cols:4"><div class="campo"><label>Pontos de Memória</label><input id="memoria" type="number" value="${num(dados.memoria,0)}"></div><div class="campo"><label>Loucura</label><input id="loucura" type="number" value="${num(dados.loucura,0)}"></div><div class="campo"><label>Estresse</label><input id="estresse" type="number" value="${num(dados.estresse,0)}"></div><div class="campo"><label>Miasma</label><input id="miasma" type="number" value="${num(dados.miasma,0)}"></div></div><p class="note" style="margin-top:9px">No Tipe Wipe ou morte do Sem Talento, o tempo volta ao último descanso seguro. Recursos físicos, ferimentos e moedas gastos retornam; memória fica.</p></div><div class="bloco"><h2>🧠 Gastos de Memória</h2><div class="list"><div class="rowcard"><h3>Antecipação Tática — 1</h3><p>Esquiva perfeita automática contra o primeiro ataque de uma emboscada conhecida.</p></div><div class="rowcard"><h3>Trapaça de Linha do Tempo — 1</h3><p>Usa conhecimento prévio para obter prata sem risco em jogos/apostas.</p></div><div class="rowcard"><h3>Coração da Besta — 2</h3><p>Reação contra dano letal; permanece com exatamente 1 PV.</p></div></div></div><div class="bloco"><h2>☠️ Miasma & Surto</h2><p>Miasma reduz cura recebida pela metade e gera Estresse temporário por rodada. Quando Loucura/Estresse iguala Vontade, ocorre surto: desvantagem em INT e PER e risco de atacar aliados/paralisar no início do combate.</p><p>O Retorno concede +1 Loucura permanente a quem retém memórias do ciclo.</p></div></section>
<section id="tab_orbita" class="tab-pane"><div class="bloco"><h2>🌌 ÓRBITAS DA MATRIZ: FREQUÊNCIAS DO SOBREVIVENTE</h2><p class="note"><strong>Centro:</strong> O NÚCLEO VAZIO (EIXO DISTORCIDO). A Órbita é uma rede radial de cinco Frequências periféricas. <strong>NÃO UTILIZE FORMATOS HEXAGONAIS.</strong></p><div class="orbit-map" id="orbit_map"><div class="orbit-center"><strong>NÚCLEO VAZIO</strong><small>EIXO DISTORCIDO</small></div><button type="button" class="orbit-node orbit-norte" data-orbit-name="SUPREMACIA CORPOREAL">SUPREMACIA<br>CORPOREAL</button><button type="button" class="orbit-node orbit-noroeste" data-orbit-name="ALQUIMIA VIBRACIONAL">ALQUIMIA<br>VIBRACIONAL</button><button type="button" class="orbit-node orbit-sudoeste" data-orbit-name="ARQUITETURA CONVENIENTE">ARQUITETURA<br>CONVENIENTE</button><button type="button" class="orbit-node orbit-nordeste" data-orbit-name="PROJEÇÃO VETORIAL">PROJEÇÃO<br>VETORIAL</button><button type="button" class="orbit-node orbit-sudeste" data-orbit-name="PULSO DE SUBMISSÃO">PULSO DE<br>SUBMISSÃO</button><svg class="orbit-lines" viewBox="0 0 900 520" aria-label="Mapa radial das frequências"><line x1="450" y1="260" x2="450" y2="70"/><line x1="450" y1="260" x2="170" y2="150"/><line x1="450" y1="260" x2="170" y2="390"/><line x1="450" y1="260" x2="730" y2="150"/><line x1="450" y1="260" x2="730" y2="390"/></svg></div><div id="orbit_detail" class="rowcard" style="margin-top:10px">Selecione uma Frequência para ver suas conexões e custos.</div></div><div class="bloco"><h2>🔥 Fricção de Frequência</h2><table class="rule-table"><tr><th>Distância</th><th>Custo</th><th>Fricção</th><th>Penalidade</th></tr><tr><td>Primária (0 Salto)</td><td>Custo Base de PM</td><td>0</td><td>Nenhuma</td></tr><tr><td>Vizinhança (1 Salto)</td><td>+1 PM</td><td>+1</td><td>Nenhuma</td></tr><tr><td>Distante (2 Saltos)</td><td>+3 PM</td><td>+3</td><td>-3 no Dado</td></tr></table><p>Ao fim do turno, sofre Dano de Impacto Espiritual igual à Fricção acumulada. Pela Descarga Balística, pode converter a Fricção em 1d6 de dano por ponto se acertar; se errar ou falhar criticamente, ocorre Refluxo Orbital.</p></div><div class="bloco"><h2>🌀 Regra do Núcleo Vazio</h2><p>Resultado 6 no alinhamento: role novamente 1d6 para definir a Órbita Primária aparente e receba +2 Loucura Permanente. O <strong>Giro de Eixo</strong> permite, uma vez por cena, tratar uma Frequência Distante como Primária por 1 rodada, zerando custos adicionais de PM e Fricção daquela ação.</p></div><div class="bloco"><h2>🧭 As 5 Frequências</h2><div class="list">${ORBITA_MATRIZ.frequencias_perifericas.map(x=>`<div class="rowcard"><h3>${x.nome}</h3><p><strong>${x.verbo}</strong> · ${x.posicao_visual} · Atributos: ${x.atributos}</p><p>${x.descricao}</p></div>`).join('')}</div></div><div class="bloco"><h2>🧠 Engenharia da Órbita</h2><p>As técnicas formadas seguem a distância real entre a Órbita Primária e a propriedade usada. Técnicas Livres podem usar Dados de Conceito para criar uma dobra espacial: Vizinhas podem ser tratadas temporariamente como Primárias; Distantes podem cair para +1 PM e 1 Fricção quando a narrativa conectar perfeitamente os conceitos.</p></div></section><section id="tab_equipamentos" class="tab-pane"><div class="bloco"><h2>🗡️ Armas</h2><table class="rule-table"><tr><th>Categoria</th><th>Dano</th><th>Atributo</th><th>Propriedades</th></tr>${armaHtml}</table></div><div class="bloco"><h2>🛡️ Armaduras</h2><table class="rule-table"><tr><th>Tipo</th><th>CA</th><th>Limite AGI</th><th>Propriedades</th></tr>${armHtml}</table></div><div class="bloco"><h2>⚙️ Modificações do Mercado Negro</h2><table class="rule-table"><tr><th>Modificação</th><th>Custo</th><th>Efeito</th></tr>${modHtml}</table><p class="note">Uma arma pode ter no máximo 2 modificações simultâneas.</p></div><div class="bloco"><h2>🧪 Consumíveis</h2><div class="list"><div class="rowcard"><h3>Sais de Amônia de Guerrilha</h3><p>Ação bônus; remove Exausto e recupera 5 PF. No próximo ciclo: -5 PV máximos até descanso longo.</p></div><div class="rowcard"><h3>Poção de Sangue Sintético</h3><p>Cura 2d4 + 2 PV e funciona sob Miasma.</p></div><div class="rowcard"><h3>Fumaça de Pimenta Alquímica</h3><p>Ação de movimento ou bônus; nuvem de 3m, cega por 1 rodada criaturas sem sentidos aguçados.</p></div></div></div></section>
<section id="tab_treino" class="tab-pane"><div class="bloco"><h2>🏕️ Economia de Trincheira</h2><div class="grid" style="--cols:4"><div class="campo"><label>Horas de preparação</label><input id="horas" type="number" min="0" value="${num(dados.horas,4)}"></div><div class="campo"><label>Treinos acumulados</label><input id="treinos" type="number" min="0" value="${num(dados.treinos,0)}"></div><div class="campo"><label>Pratas</label><input id="pratas" type="number" min="0" value="${num(dados.pratas,0)}"></div><div class="campo"><label>Ciclos sobrevividos</label><input id="ciclos" type="number" min="0" value="${num(dados.ciclos,0)}"></div></div><div class="list" style="margin-top:9px"><div class="rowcard"><h3>Treinamento de Linhagem — 2h</h3><p>Acumula Dias de Treinamento para Grau ou técnicas do Sem Talento.</p></div><div class="rowcard"><h3>Forja Rúnica — 3h</h3><p>Repara armaduras ou concede +1 dano físico temporário.</p></div><div class="rowcard"><h3>Alquimia de Guerrilha — 2h</h3><p>Produz Veneno Paralisante Esmeralda; aplicação custa Ação Bônus.</p></div><div class="rowcard"><h3>Mercado Negro — 0h</h3><p>Compra modificações, armas ocultas e poções usando Prata.</p></div></div></div><div class="bloco"><h2>🧠 O Sem Talento</h2><p><strong>O Retorno:</strong> 1 vez por sessão, ao morrer, retorna ao último descanso seguro e retém memórias.</p><p><strong>Obsessão pelo Treino:</strong> 1 vez/dia, um treinamento vale por dois.</p><p><strong>Esponja de Técnicas:</strong> Básicas 5 treinos; Intermediárias 15; Avançadas 30; Supremas 50 + Romper a Muralha.</p><p><strong>Limite biológico:</strong> número de habilidades emprestadas ativas = soma dos modificadores de INT + VON.</p></div></section>
<section id="tab_historia" class="tab-pane"><div class="bloco"><h2>📜 História & Campanha</h2><div class="grid" style="--cols:2"><div class="campo"><label>História</label><textarea id="historia">${esc(dados.historia||'')}</textarea></div><div class="campo"><label>Objetivos / missão</label><textarea id="objetivos">${esc(dados.objetivos||'')}</textarea></div><div class="campo"><label>Traumas / cicatrizes dos ciclos</label><textarea id="traumas">${esc(dados.traumas||'')}</textarea></div><div class="campo"><label>Notas do Mestre</label><textarea id="notas_mestre">${esc(dados.notas_mestre||'')}</textarea></div></div></div></section>`;
['nivel','grau_linhagem','xp_atual','raca','classe','orbita_primaria','pv','pv_max','pf','pm','ca','bonus_armadura','bonus_escudo','postura','memoria','loucura','estresse','miasma','saltos','friccao','tec_nome','tec_pm','tec_prop','tec_friccao','tec_desc','tec_limites','pp','maestria','dados_conceito_usados','caminho','horas','treinos','pratas','ciclos','historia','objetivos','traumas','notas_mestre'].forEach(id=>{const e=document.getElementById(id);if(e)e.addEventListener('input',()=>{sincronizarDados();calcular()} )});ATTR.forEach(([a])=>document.getElementById('attr_'+a)?.addEventListener('input',()=>{sincronizarDados();calcular()}));document.getElementById('raca')?.addEventListener('change',()=>{atualizarInfo();sincronizarDados()});document.getElementById('classe')?.addEventListener('change',()=>{atualizarInfo();sincronizarDados()});document.getElementById('grau_linhagem')?.addEventListener('input',calcular);document.getElementById('orbita_primaria')?.addEventListener('change',()=>{set('orbita_primaria_2',val('orbita_primaria'));atualizarOrbita();sincronizarDados()});document.getElementById('orbita_primaria_2')?.addEventListener('change',()=>{set('orbita_primaria',val('orbita_primaria_2'));atualizarOrbita();sincronizarDados()});document.getElementById('btn_orbita')?.addEventListener('click',rolarOrbita);document.querySelectorAll('.orbit-node').forEach(b=>b.addEventListener('click',()=>selecionarOrbitaPorNome(b.dataset.orbitName)));atualizarInfo();calcular();atualizarOrbita();const last=localStorage.getItem('sobreviventes_ultima_aba');abrirAba(TABS.some(x=>x[0]===last)?last:'identidade')}
function atualizarInfo(){const r=val('raca'),c=val('classe');const ri=document.getElementById('raca_info');const ci=document.getElementById('classe_info');if(ri)ri.innerHTML='<strong>'+esc(r)+':</strong> '+esc(RACAS[r]||'');if(ci)ci.innerHTML='<strong>'+esc(c)+':</strong> '+esc(CLASSES[c]||'')}
function calcular(){const g=num(val('grau_linhagem'),1);ATTR.forEach(([a])=>{const e=document.getElementById('mod_'+a);if(e)e.textContent=mod(val('attr_'+a),g)});const con=num(val('attr_CON')),von=num(val('attr_VON')),int=num(val('attr_INT'));const pf=10+(con+von)*2,pm=10+(int+von)*2;if(document.getElementById('pf_max_calc'))document.getElementById('pf_max_calc').textContent=pf;if(document.getElementById('pm_max_calc'))document.getElementById('pm_max_calc').textContent=pm}
function rolarTeste(){const a=val('teste_attr')||'FOR',v=num(val('attr_'+a)),g=num(val('grau_linhagem'),1),m=mod(v,g),d=Math.floor(Math.random()*20)+1,total=d+m,cd=num(val('teste_cd'),10);document.getElementById('teste_result').textContent=`d20 = ${d} | modificador +${m} | total ${total} | ${total>=cd?'SUCESSO':'FALHA'}${d===20?' · 20 NATURAL!':''}${d===1?' · 1 NATURAL!':''}`}
function rolarOrbita(){let d=Math.floor(Math.random()*6)+1;if(d===6){const d2=Math.floor(Math.random()*5)+1;set('orbita_primaria',String(d2));set('orbita_primaria_2',String(d2));dados.loucura=num(dados.loucura)+2;document.getElementById('orbita_result').textContent=`🎲 ${d} → Núcleo Vazio → nova rolagem ${d2}. +2 Loucura permanente.`}else{set('orbita_primaria',String(d));set('orbita_primaria_2',String(d));document.getElementById('orbita_result').textContent=`🎲 Órbita Primária: ${d} — ${ORBITAS[d][0]}`;}atualizarOrbita();sincronizarDados()}
function atualizarOrbita(){const k=num(val('orbita_primaria'),0);const e=document.getElementById('orbita_info');if(e)e.innerHTML=k&&ORBITAS[k]?`<strong>${ORBITAS[k][2]}</strong> · ${ORBITAS[k][0]} · Atributo-chave: ${ORBITAS[k][1]}`:'Escolha ou role sua Órbita Primária.';document.querySelectorAll('.orbit-node').forEach(b=>b.classList.toggle('active',b.dataset.orbitName===ORBITAS_MODO_NOME(k)));const d=document.getElementById('orbit_detail');if(d&&k&&ORBITAS[k]){const nome=ORBITAS[k][2],f=ORBITA_BY_NAME[nome];d.innerHTML=`<h3>${f.nome}</h3><p><strong>${f.verbo}</strong> · ${f.posicao_visual} · ${f.atributos}</p><p>${f.descricao}</p><p><strong>Conexões:</strong> ${f.conexoes.map(c=>`${c[0]} — ${c[1]} Salto (${c[2]})`).join(' · ')}</p>`}}function ORBITAS_MODO_NOME(k){return k&&ORBITAS[k]?ORBITAS[k][2]:''}function selecionarOrbitaPorNome(nome){const f=ORBITA_BY_NAME[nome];if(!f)return;const idx=Object.keys(ORBITAS).find(k=>ORBITAS[k][2]===nome);if(idx){set('orbita_primaria',idx);set('orbita_primaria_2',idx);atualizarOrbita();sincronizarDados();} }
function sincronizarDados(){dados={...dados,_sistema_id:sistema?.id,_sistema_nome:sistema?.nome,_modo:modo,tipo:'sobreviventes_fronteira',nome:val('nome'),raca:val('raca'),classe:val('classe'),nivel:num(val('nivel'),1),grau_linhagem:num(val('grau_linhagem'),1),xp_atual:num(val('xp_atual'),0),orbita_primaria:val('orbita_primaria'),pv:num(val('pv'),0),pv_max:num(val('pv_max'),0),pf:num(val('pf'),0),pm:num(val('pm'),0),ca:num(val('ca'),10),bonus_armadura:num(val('bonus_armadura'),0),bonus_escudo:num(val('bonus_escudo'),0),postura:num(val('postura'),0),memoria:num(val('memoria'),0),loucura:num(val('loucura'),0),estresse:num(val('estresse'),0),miasma:num(val('miasma'),0),saltos:num(val('saltos'),0),friccao:num(val('friccao'),0),tec_nome:val('tec_nome'),tec_pm:num(val('tec_pm'),0),tec_prop:val('tec_prop'),tec_friccao:num(val('tec_friccao'),0),tec_desc:val('tec_desc'),tec_limites:val('tec_limites'),pp:num(val('pp'),0),maestria:num(val('maestria'),1),dados_conceito_usados:num(val('dados_conceito_usados'),0),caminho:val('caminho'),horas:num(val('horas'),4),treinos:num(val('treinos'),0),pratas:num(val('pratas'),0),ciclos:num(val('ciclos'),0),historia:val('historia'),objetivos:val('objetivos'),traumas:val('traumas'),notas_mestre:val('notas_mestre')};ATTR.forEach(([a])=>dados['attr_'+a]=num(val('attr_'+a),0));return dados}
function obter(){return sincronizarDados()}
function salvarLocal(){localStorage.setItem('ficha_sobreviventes_'+(sistema?.id||'generico'),JSON.stringify(obter()));alert('💾 Rascunho de Sobreviventes da Fronteira salvo neste dispositivo.')}
function carregarLocal(){const raw=localStorage.getItem('ficha_sobreviventes_'+(sistema?.id||'generico'));if(!raw)return alert('Nenhum rascunho encontrado.');dados=JSON.parse(raw);render();alert('↩️ Rascunho recuperado.')}
function enviar(){window.parent.postMessage({type:'cronicas-camelot-ficha-pronta',dados:obter(),modo,sistema_id:sistema?.id},location.origin)}
function carregar(s){sistema=s;config=s.configuracao||{};render()}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='cronicas-camelot-carregar-sistema'){carregar(e.data.sistema);return}if(e.data?.type==='cronicas-camelot-carregar-ficha'){dados=e.data.dados||{};modo=e.data.modo||'edicao';if(sistema)render()}});const p=new URLSearchParams(location.search);modo=p.get('modo')||'criacao';render();
</script></body></html>
