(--muted)}.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid #51432d;border-radius:999px;padding:5px 9px;background:#0b0e14;color:#dbc58e}.progress{height:10px;background:#080b11;border:1px solid #403728;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));width:0}.level-table{width:100%;border-collapse:collapse;font-size:.9rem}.level-table th,.level-table td{border:1px solid #403728;padding:6px;text-align:center}.level-table th{color:var(--gold2);background:#16130e}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.hidden{display:none!important}.exclusive{color:#e7ca82;font-size:.82rem}.class-info{padding:10px;background:#0a0e15;border:1px solid #3c4652;border-radius:6px;margin-top:9px}.class-info strong{color:var(--blue)}.skill-progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.skill-unlock{padding:10px;border:1px solid #4b4030;border-radius:6px;background:#0b0e14}.skill-unlock strong{display:block;color:var(--gold2)}@media(max-width:900px){.attrs{grid-template-columns:repeat(2,1fr)}.skill-grid{grid-template-columns:1fr 1fr}.jewel{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}.skill-progress{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){body{padding:5px}.ficha{padding:9px}.top h1{font-size:1.4rem}.grid,.attrs,.cards,.skill-progress{grid-template-columns:1fr!important}.attr .row{grid-template-columns:1fr 68px 60px}.skill-grid,.jewel{grid-template-columns:1fr}.actions .btn{width:100%}}

<script>
let sistema=null,config={},modo='criacao',dados={};
const ATTR=[['FOR','Força'],['DES','Destreza'],['INT','Inteligência'],['SAB','Sabedoria'],['CAR','Carisma'],['CON','Constituição']];
const PERICIAS=[['Acrobatics','DES'],['Animal Handling','SAB'],['Arcana','INT'],['Athletics','FOR'],['Deception','CAR'],['History','INT'],['Insight','SAB'],['Intimidation','CAR'],['Investigation','INT'],['Medicine','SAB'],['Nature','INT'],['Perception','SAB'],['Performance','CAR'],['Persuasion','CAR'],['Religion','SAB'],['Sleight of Hand','DES'],['Stealth','DES'],['Survival','SAB']];
const REINOS=['Olímpia','Lumier','Cluvant','Bel','Fenrir','Long Bunker','Cassiantopia','Magistar','Deviation'];
const CLASSES=['Guerreiro','Cavaleiro','Atirador','Arqueiro','Caçador','Ranger','Mago','Bruxo','Elementalista','Assassino','Trapaceiro Arcano','Ladrão','Ninja','Clérigo','Alquimista','Templário','Paladino','Feiticeiro','Invocador','Necromante','Druida','Xamã','Monge','Lutador','Bardo','Dançarino','Bárbaro','Berserker'];

const ESTILOS={
 'Guerreiro':[
  ['Deus do ataque','Estilo que ignora parcialmente, ou completamente, a defesa.','Sequência de ataques','O personagem desfere uma sequência de 3 ataques: 1d6, 2d3 e 3d2 de dano.'],
  ['Deus da defesa','Focado em defender e desferir um contra-ataque.','Defesa titânica','Quando é alvo de um ataque, gira Constituição; se acertar, defende com o escudo, abre a defesa e devolve o dano que levaria +1d6.'],
  ['Deus do equilíbrio','Estilo balanceado e tradicional.','Avanço “zombador”','Corre com o escudo à frente, empurrando e acertando inimigos em sua reta por 1d6 e atraindo sua atenção.']
 ],
 'Cavaleiro':[
  ['Lanceiro','Exclusivo para usuários de lança; usa a montaria para ataques e perfuração.','Estocada voadora','Corrida com a montaria, salto em direção ao alvo e estocada de 1d6 + 1d20 de chance de perfuração.'],
  ['Arqueiro montado','Especialização em arco e flecha enquanto luta montado.','Sequência de flechas','Escolhe até 6 alvos e dispara uma flecha em cada um, 1d6 por flecha. Pode concentrar no mesmo alvo, aumentando sua chance de defesa.'],
  ['Porta estandarte','Carrega o estandarte e eleva a moral do exército.','Grito de guerra','Aumenta dano dos aliados e diminui dano dos inimigos; eficácia em 1d6, com teste de Constituição dos inimigos para ignorar o debuff.']
 ],
 'Atirador':[
  ['Armadilheiro','Especialista em preparar o terreno com armadilhas.','Rede flamejante','Rede com óleo seguida de fogo, incendiando o alvo e causando 2d6.'],
  ['Usuário de besta','Usa besta encantada com cadência maior e dano/penetração levemente reduzidos.','Atirador a queima-roupa','Salta em direção ao inimigo, chuta e dispara de muito perto, causando 1d6, aumentando a penetração e empurrando o alvo.'],
  ['Arco longo','Arco pesado de alcance, precisão, dano e penetração superiores, porém lento em curta distância.','Flecha de Artemis','Leva dois turnos para ser lançada e causa 3d6 de dano.']
 ],
 'Arqueiro':[], 'Caçador':[], 'Ranger':[],
 'Ninja':[

  ['Arqueiro furtivo','Furtividade com arco curto e maestria em armas curtas.','Flecha envenenada','1d6 de dano e mais 1d6 durante 5 turnos.'],
  ['Sabotador','Arma e desarma armadilhas, com grande detecção de mecanismos.','Armadilha instantânea','Constrói silenciosamente uma armadilha de sua escolha em um turno; dano depende da armadilha.']
 ],
 'Alquimista':[['Box','Estilo baseado em combos e mobilidade.','Troca equivalente','Consegue transmutar uma vez a cada 5 turnos.']],
 'Templário':[['Escudos da fé','Abdica do ataque e usa dois escudos enormes; maior resistência entre as classes.','Fé inabalável','Bate os escudos no chão e cria um escudo para si e aliados, suportando até 1d12 de dano.'],['Exorcista','Estilo criado para exterminar demônios.','Chamas da fé','Queima o alvo com chamas sagradas, 1d6 por 3 turnos.'],['Arqueiro da fé','Usa grandes arcos para conjurar milagres.','Flecha divina','Causa 1d12 e pode conjurar um milagre à escolha do conjurador.']],
 'Paladino':[['Escudos da fé','Abdica do ataque e usa dois escudos enormes; maior resistência entre as classes.','Fé inabalável','Bate os escudos no chão e cria um escudo para si e aliados, suportando até 1d12 de dano.'],['Exorcista','Estilo criado para exterminar demônios.','Chamas da fé','Queima o alvo com chamas sagradas, 1d6 por 3 turnos.'],['Arqueiro da fé','Usa grandes arcos para conjurar milagres.','Flecha divina','Causa 1d12 e pode conjurar um milagre à escolha do conjurador.']],
 'Druida':[['Companheiros de corpo e alma','Golpes em dupla com o familiar e combos rápidos.','Presas gêmeas','Familiar ataca pelas costas reduzindo defesa; depois o druida corta o alvo: 1d6 do familiar e 2d3 do personagem.'],['Mestre do terreno','Luta rápida e acrobática usando o terreno.','Terreno escorregadio','Cria solo lamacento nos pés do alvo e desfere ataques consecutivos: 1d6 e 1d4.']],
 'Xamã':[['Arte marcial + arma','Escolhe uma das artes marciais do Lutador e uma arma média para curta.','Estilo do Xamã','O Guia determina a combinação de arte marcial e arma; os espíritos animais permitem roubar habilidades e atributos.']],
 'Lutador':[['Box','Combos e mobilidade.','',''],['Sumo','Exclusivo de Cassiantopia.','',''],['Taekwondo','Arte marcial disponível ao Lutador.','',''],['Capoeira','Arte marcial disponível ao Lutador.','',''],['Muay Thai','Arte marcial disponível ao Lutador.','',''],['Judô','Arte marcial disponível ao Lutador.','','']],
 'Dançarino':[['Taekwondo','Estilo permitido ao Dançarino.','',''],['Capoeira','Estilo permitido ao Dançarino.','','']],
 'Bárbaro':[['Fúria das bestas','Suporta dor e foca ataques fortes e combos em fúria.','Matilha de ataques','Após receber dano superior a 30% da Vida, entra em fúria, ignora 1d6 de dano e desfere 5 ataques: 1d6 nos 3 primeiros e 1d4 nos demais.'],['Procurar e destruir','Caça e elimina alvos importantes do exército inimigo.','Farejador de mana','Sente a presença de usuário de magia em até 1d6 de distância.'],['Corrida das armas','Usa de maneira aceitável grande parte das armas e luta com o que estiver ao alcance.','Mestre de guerra','Avança atacando inimigos ao alcance com armas nas mãos e até de inimigos mortos, usando o dado da arma.']],
 'Berserker':[['Fúria das bestas','Suporta dor e foca ataques fortes e combos em fúria.','Matilha de ataques','Após receber dano superior a 30% da Vida, entra em fúria, ignora 1d6 de dano e desfere 5 ataques: 1d6 nos 3 primeiros e 1d4 nos demais.'],['Procurar e destruir','Caça e elimina alvos importantes do exército inimigo.','Farejador de mana','Sente a presença de usuário de magia em até 1d6 de distância.'],['Corrida das armas','Usa de maneira aceitável grande parte das armas e luta com o que estiver ao alcance.','Mestre de guerra','Avança atacando inimigos ao alcance com armas nas mãos e até de inimigos mortos, usando o dado da arma.']]
};
const SEM_ESTILO=['Mago','Bruxo','Feiticeiro','Invocador','Necromante','Clérigo','Bardo'];
const XP=[];for(let i=1;i<=20;i++)XP.push(100*Math.pow(2,i-1));
const TABS=[['identidade','📜 Identidade'],['atributos','⚔️ Atributos'],['pericias','📚 Perícias'],['habilidades','✨ Habilidades'],['joias','💎 Jóias'],['magias','🔮 Magias'],['equipamentos','🛡️ Equipamentos'],['itens','🎒 Itens'],['progressao','📈 Progressão']];
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function num(v,d=0){const n=Number(v);return Number.isFinite(n)?n:d}
function multAttr(v){return Math.floor(Math.max(0,num(v,0))/3)}
function valor(id){return document.getElementById(id)?.value ?? dados[id] ?? ''}
function optionList(arr,sel,placeholder='Selecione'){return `<option value="">${placeholder}</option>`+arr.map(x=>`<option value="${esc(x)}" ${String(x)===String(sel)?'selected':''}>${esc(x)}</option>`).join('')}
function renderTabs(){document.getElementById('tabs').innerHTML=TABS.map(([id,t],i)=>`<button type="button" class="btn btn-small tab-btn ${i===0?'active':''}" data-tab="${id}">${t}</button>`).join('');document.querySelectorAll('.tab-btn').forEach(b=>b.onclick=()=>abrirAba(b.dataset.tab))}
function abrirAba(id){document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('active',p.id==='tab_'+id));localStorage.setItem('olimpia_ultima_aba',id);window.scrollTo({top:0,behavior:'smooth'})}
function classesDisponiveis(){const reino=valor('reino');const exclusivas=EXCLUSIVAS[reino]||[];return CLASSES.filter(c=>!Object.values(EXCLUSIVAS).flat().includes(c)||exclusivas.includes(c))}
function atualizarClasses(){const s=document.getElementById('classe');if(!s)return;const atual=s.value||dados.classe||'';s.innerHTML=optionList(classesDisponiveis(),atual,'Selecione o reino primeiro');if(atual&&!classesDisponiveis().includes(atual))s.value='';atualizarEstilos();atualizarInfoClasse()}
function atualizarEstilos(){const classe=valor('classe');const sel=document.getElementById('estilo');if(!sel)return;const lista=ESTILOS[classe]||[];if(SEM_ESTILO.includes(classe)){sel.innerHTML='<option value="">Sem estilos de combate para esta classe</option>';sel.disabled=true;atualizarEstiloInfo();return}if(!lista.length){sel.innerHTML='<option value="">Estilo definido pelo Mestre</option>';sel.disabled=false;return}sel.disabled=false;sel.innerHTML=optionList(lista.map(x=>x[0]),dados.estilo||'','Escolha um estilo');atualizarEstiloInfo()}
function atualizarEstiloInfo(){const classe=valor('classe'),estilo=valor('estilo'),box=document.getElementById('estilo-info');if(!box)return;const item=(ESTILOS[classe]||[]).find(x=>x[0]===estilo);if(!item){box.innerHTML='<span class="muted">Selecione um estilo para visualizar a habilidade de combate associada.</span>';return}box.innerHTML=`<strong>${esc(item[0])}</strong><p>${esc(item[1])}</p><div class="note"><b>Habilidade do estilo: ${esc(item[2])}</b><br>${esc(item[3])}</div>`}
function atualizarInfoClasse(){const c=valor('classe'),box=document.getElementById('classe-info');if(!box)return;const textos={
 'Guerreiro':'Classe básica, versátil, bruta e sem magia. Usa arma média/grande e escudo.',
 'Cavaleiro':'Semelhante ao Guerreiro, normalmente usa montaria e combate sobre ela.',
 'Atirador':'Classe clássica de fácil uso e principal DPS das raids.',
 'Mago':'Modela o véu da realidade para conjurar feitiços.',
 'Bruxo':'Usuário de artefatos e magias ancestrais.',
 'Elementalista':'Conjura elementos mágicos no próprio corpo para combate físico; pode escolher estilo do Lutador.',
 'Feiticeiro':'Usuário de contratos espirituais; anda com uma fada e só conjura o elemento dela.',
 'Invocador':'Adestra monstros ou escravos, aumentando atributos base e dano em 3.',
 'Necromante':'Semelhante ao Invocador, mas só adestra mortos.',
 'Ninja':'Única classe furtiva descrita com maestria em qualquer tipo de arma.',
 'Clérigo':'Sacerdote e curandeiro, dono de força e resistência.',
 'Alquimista':'Cientista especializado em criar poções e artefatos.',
 'Templário':'Guerreiro divino híbrido de ataque, defesa, cura e exorcismo.',
 'Paladino':'Tanque de fé voltado a proteger, curar e atuar com versatilidade.',
 'Druida':'Espadachim/arqueiro com familiar animal, compartilhando sentidos e magias.',
 'Xamã':'Guerreiro que usa espíritos animais para roubar habilidades e atributos; começa com 3 animais.',
 'Monge':'Classe de combate corpo a corpo que usa técnicas e Ki.',
 'Lutador':'Classe versátil e veloz, capaz de causar grande dano.',
 'Dançarino':'Classe de entretenimento com estilos de artes marciais definidos pelo Guia.',
 'Bardo':'Combate corporal praticamente nulo; seu estilo gira em torno das músicas.',
 'Bárbaro':'Classe guiada pela fúria e pelo instinto primitivo.',
 'Berserker':'Variação ofensiva guiada pela fúria e pelo instinto.'
};box.innerHTML=textos[c]?`<strong>${esc(c)}</strong><p>${esc(textos[c])}</p>`:'<span class="muted">Selecione uma classe para ver a descrição registrada no Guia.</span>'}

function renderPericiasListeners(){document.querySelectorAll('[data-pericia]').forEach(e=>e.addEventListener('input',()=>{dados.pericias=obterPericias()}))}
function obterPericias(){return PERICIAS.map(([nome,atributo])=>({nome,atributo,valor:document.querySelector(`[data-pericia="${CSS.escape(nome)}"]`)?.value||''}))}

function obterHabilidades(){return ['passiva','habilidade1','habilidade2','habilidade3','ultimate'].map(slot=>{const out={slot};document.querySelectorAll(`[data-skill-slot="${slot}"]`).forEach(e=>out[e.dataset.k]=e.value);return out})}
function obterJoias(){return [...document.querySelectorAll('[data-jewel]')].reduce((acc,e)=>{const i=Number(e.dataset.jewel);acc[i]=acc[i]||{};acc[i][e.dataset.k]=e.value;return acc},[]).filter(Boolean)}

function obterItens(){return [...document.querySelectorAll('[data-item]')].reduce((acc,e)=>{const i=Number(e.dataset.item);acc[i]=acc[i]||{};acc[i][e.dataset.k]=e.value;return acc},[]).filter(Boolean)}
